<style>
/* Layout: full-bleed 3D view of the flat; a slim control sheet floats over the lower-left corner (bottom strip on phones). */
:root {
  --bg: #e4e2dc;
  --panel: rgba(250, 248, 244, 0.46);
  --panel-solid: rgba(250, 248, 244, 0.46);
  --fg: #23211e;
  --muted: #6d6860;
  --line: rgba(35, 33, 30, 0.14);
  --accent: #4f6b5c;
  --font-ui: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c1a; --panel: rgba(30, 31, 29, 0.46); --panel-solid: rgba(30, 31, 29, 0.46); --fg: #ecebe6; --muted: #a29d94;
    --line: rgba(236, 235, 230, 0.16); --accent: #8fb39f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1c1a; --panel: rgba(30, 31, 29, 0.46); --panel-solid: rgba(30, 31, 29, 0.46); --fg: #ecebe6; --muted: #a29d94;
  --line: rgba(236, 235, 230, 0.16); --accent: #8fb39f; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.sheet {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(394px, calc(100% - 32px)); box-sizing: border-box; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 16px; display: grid; gap: 11px;
  max-height: calc(100% - 230px); overflow-y: auto;
}
.head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  position: sticky; top: -14px; z-index: 2; margin: -14px -16px 0; padding: 14px 16px 6px; background: none; border-radius: 10px 10px 0 0;
}
.head .btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; flex: none; max-width: 62%; }
#fold { flex: none; font-size: 12px; padding: 4px 10px; }
.langs { display: flex; gap: 3px; flex: none; }
.langs .seg { font-size: 12px; padding: 4px 7px; }
.sheet.min { gap: 0; }
.sheet.min .head { padding-bottom: 14px; margin-bottom: -14px; }
.sheet.min .sub { display: none; }
.sheet h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; text-wrap: balance; }
.sheet .sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-family: var(--font-data); }
.group { display: grid; gap: 6px; }
.label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
button.seg {
  font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
}
button.seg[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button.seg:disabled { opacity: 0.38; cursor: not-allowed; }
button.chip {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; cursor: pointer;
  padding: 4px 9px 4px 5px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg);
}
button.chip i { width: 16px; height: 16px; border-radius: 50%; display: block; border: 1px solid var(--line); }
button.chip[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { margin: 0; font-size: 11px; line-height: 1.55; color: var(--muted); }
.fold { font: inherit; font-size: 12px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; justify-self: start; }
.sheet.min .group, .sheet.min .note { display: none; }
.viewbar {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; max-width: calc(100% - 32px); box-sizing: border-box;
  display: grid; gap: 6px; padding: 8px 10px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px;
}
.viewbar .label { flex: none; padding-top: 5px; }
.vrow { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.vrow .label { min-width: 2.2em; }
.ctx { display: grid; gap: 5px; padding-top: 6px; border-top: 1px solid var(--line); min-width: 0; }
.ctx[hidden], .ctx .row[hidden], #views .row[hidden] { display: none; }
.ctx .sep, .sheet .sep { flex: none; width: 1px; align-self: stretch; margin: 3px 3px; background: var(--line); }
.viewbar .row { gap: 5px; }
.viewbar button.seg { font-size: 12px; padding: 4px 9px; }
@media (max-width: 900px) {
  .viewbar .row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .viewbar button.seg { flex: none; }
}
@media (max-width: 520px) {
  .viewbar { left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); max-width: none; padding: 6px 8px; }
  .sheet { left: 12px; right: 12px; width: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 12px; gap: 9px; max-height: 48%; }
  .head { top: -12px; margin: -12px -12px 0; padding: 12px 12px 6px; }
  .head { flex-wrap: wrap; row-gap: 8px; } .head .btns { max-width: none; justify-content: flex-start; }   /* phone: the buttons go under the title */
  .sheet.min .head { padding-bottom: 12px; margin-bottom: -12px; }
}
</style>

  const head = new THREE.Group(); head.position.set(hx, hy, hz); g.add(head);
  const cg = new THREE.CylinderGeometry(0.021, 0.021, 0.046, 32); cg.rotateX(Math.PI / 2);

  const lens = new THREE.Mesh(new THREE.CircleGeometry(0.016, 24), lampGlow); lens.position.z = 0.0235; head.add(lens);
  head.lookAt(aim);

re magnetic tiles stacked in the corner. On the right, the way in from the door to the beds stays about 1.05 m (about 70 cm past the fabric box by the right wall). His four plush toys sit at the head of the left bed: the yellow chicken (red comb), the capybara, the Roblox plush and the green bird with fuzzy hair; the dinosaur stays on the right bed. Two fabric boxes with lids: one between the bed heads as a bedside table, one against the right-hand wall for toys.", "电视放在客厅窗角时，这块地方被电视占了，凳子先不显示。": "With the TV in the living-room window corner this spot is taken by the TV, so the stool is hidden for now.", "cm（稍挤）。黑色小边几一个，在转椅内侧（靠窗、靠墙那边）放杯子。": " cm (a bit tight). The small black side table on the chair's inner side (toward the window and the wall) for a cup.", "转椅在窗边，面向沙发；黑色小边几在旁边（伸手能放杯子），就是参考图": "The swivel chair is by the window facing the sofa; the small black side table beside it (within reach for a cup); the reference photo's ", "转椅 + 黑色小边几，灯放在边几后面。": "Swivel chair + the small black side table, lamp behind the side table.", "现在爸爸（180）坐在凳子上，妈妈和大孩子坐沙发；座高 45 和沙发差不多，脚不碰茶几。": "Dad (180) is on the stool now, mum and the older child on the sofa; the 45 cm seat is about sofa height and his feet stay clear of the coffee table.", "牧森 2.4m：1.8m 的爸爸躺直，头和脚两头各只剩十几厘米，刚好躺得下，不算宽裕；想把腿完全伸直放松的话还是 3.2m 的舒服。": "Musen 2.4 m: with dad (1.8 m) lying flat only a dozen or so centimetres are left at each end — he just fits, but it isn't roomy; to stretch the legs out fully the 3.2 m is the comfortable one.", "显示人物时宝宝要坐 Stokke，所以先换成 5 把 + Stokke；人物选「不显示」就是 6 把。": "With people shown the little one sits in the Stokke, so it's 5 chairs + Stokke for now; set people to \"None\" for 6 chairs.", "这个沙发靠窗那头离玻璃很近，凳子和圆几只能放在沙发头和右边落地灯之间（约 1.1m）：圆几离沙发头约 25cm，凳子和圆几隔开约 10cm。": "This sofa's window end comes close to the glass, so the stool and drum have to sit between the sofa end and the right-hand floor lamp (about 1.1 m): the drum about 25 cm from the sofa end, about 10 cm between drum and stool.", "组合2 弧形沙发 3.2m：1.8m 的爸爸躺直，头那头离扶手还有约 40cm，脚边还空出将近 1m，腿完全伸在贵妃位上，很宽裕。": "Combo 2 curved sofa 3.2 m: with dad (1.8 m) lying flat there's still about 40 cm to the arm at his head and nearly 1 m free past his feet; his legs stretch right out on the chaise — plenty of room.", "牧森 2.4m 短很多，沙发头离窗还有约 1m，所以凳子和圆几往里挪到窗户中间一带：凳子大致对着茶几，圆几在左边、隔开约 20cm，右边落地灯旁边空出来。": "The Musen 2.4 m is much shorter — its end stops about 1 m short of the window — so the stool and drum move in toward the middle of the window: the stool roughly facing the coffee table, the drum on its left about 20 cm away, and the space beside the right-hand lamp left open.", "黑色平衡臂环形灯": "Black balance-arm ring lamp", "黑色平衡臂环形灯（黑色水磨石圆柱底座 Φ14、高 26，黑色细杆，横臂斜着往上翘，一头配重；灯头是一圈黑色细环，里面半个小碗，外黑内铜色，光往下往前打；卖家标 D140×H170、LED 7W，¥368）：灯头朝窗户中间探出去约 65cm，比金色那款更细、更黑白。": "Black balance-arm ring lamp (black terrazzo column base Φ14 × 26 high, slim black rod, the arm tilted up with a counterweight at one end; the head is a thin black ring with a small half-dish inside, black outside and copper inside, lighting down and forward; listed D140 × H170, LED 7 W, ¥368): the head reaches about 65 cm toward the middle of the window — slimmer and more black-and-white than the gold one.", "现在是一盏，放在左边窗角（沙发靠窗那头），灯头朝中间探到沙发那头上方，坐沙发看书正好。": "One lamp now, in the left window corner (the sofa's window end), the head reaching over the end of the sofa — right for reading on the sofa.", "现在是一盏，放在右边窗角，灯头朝中间探到窗边凳子上方；左边沙发那头的窗角空着。": "One lamp now, in the right window corner, the head reaching over the window stool; the left corner by the sofa stays empty.", "床头柜": "Bedside", "放窗边": "By the window", "意式茶凳（米白圈绒，焦糖色圆靠枕，宽 47、深 37、高 45，底下 8cm 内缩底座）+ 窗边圆柱。": "Italian stool (off-white boucle, caramel round bolster, 47 wide, 37 deep, 45 high, on an 8 cm recessed plinth) + the window pedestal.", "凳子在窗边，背靠窗、面朝茶几，圆几在左边。": "The stool is by the window, back to the glass, facing the coffee table, with the drum on its left.", "电视放在客厅右墙时，茶几对面被电视占了，凳子先放回窗边。": "With the TV on the living-room right wall the spot across the coffee table is taken, so the stool goes back by the window.", "现在爸爸坐在凳子上，隔着茶几对着沙发上的妈妈和大孩子。": "Dad is on the stool now, across the coffee table from mum and the older child on the sofa.", "网篮支架 124×42：放正、背贴床尾那面墙，对着床中间；床尾到墙约 45cm，支架前沿离床尾只剩约 2.5cm，屏幕中心离枕头约 2.1m，": "Mesh stand 124 × 42: square to the foot wall with its back on it, facing the middle of the bed; the foot aisle is about 45 cm, so the stand's front is only about 2.5 cm from the bed; screen centre about 2.1 m from the pillows, ", "银翼 V 脚支架：立柱贴着床尾那面墙，对着床中间；两条腿（785 和 555，夹角 100°）往前伸约 50cm，床尾到墙只有约 45cm，长的那条腿会伸进床底约 10cm——床底离地约 12cm、腿只有 3.5cm 高，不会碰；屏幕正对枕头，离枕头约 2.1m。看电视时过道占住，要过人就推开（带轮子）。适配 40–70 寸，承重 30kg。": "Silver V-leg stand: the pole against the foot wall, facing the middle of the bed; the two legs (785 and 555, 100° apart) reach about 50 cm forward but the foot aisle is only about 45 cm, so the long leg slides about 10 cm under the bed — the bed stands about 12 cm off the floor and the legs are only 3.5 cm high, so nothing touches; the screen faces the pillows about 2.1 m away. While watching, the aisle is taken; push it aside to get past (it's on castors). Fits 40–70\", carries 30 kg.", "源氏木语实木床（北美黑胡桃木、木蜡油，低铺斜靠款 K33B10）：1.8m 款总宽 191.5、总深 214.5、床头高 92，床头板往后斜靠，四角方腿，床底离地约 12cm。比原来的模型长 15cm：床尾到墙的过道从约 61cm 变成约 45cm；电视支架跟着床居中，银翼支架的长腿伸进床底约 10cm（床底离地 12cm，不碰）。": "Yuanshi solid-wood bed (North American black walnut, wax oil, low bed with leaning headboard K33B10): the 1.8 m size is 191.5 wide, 214.5 deep, headboard 92 high leaning back, square corner legs, about 12 cm clear underneath. It is 15 cm longer than the old model: the aisle at the foot shrinks from about 61 cm to about 45 cm; the TV stand stays centred on the bed and the V-stand's long leg slides about 10 cm under it (12 cm clearance, no contact).", "凳子挪到黑色茶几对面，背靠右墙（离墙约 1cm），面朝沙发，焦糖色靠枕在后面当靠背；和沙发、转椅围成一圈，聊天都面对面。凳子放在茶几靠窗那头的外侧，坐下伸腿正好在茶几头外面（离茶几约 3cm），不会顶到茶几；这一侧就不走人了，去窗边从沙发和茶几中间过。窗边圆柱和玻璃小花瓶留在窗边。": "The stool moves across the black coffee table, back to the right wall (about 1 cm off), facing the sofa, the caramel bolster behind as a backrest; with the sofa and the swivel chair it closes the circle, everyone face to face. The stool sits just past the window end of the coffee table, so legs stretched out from it land beyond the end of the table (about 3 cm clear) instead of hitting it; nobody walks along this side any more — to reach the window, go between the sofa and the coffee table. The window pedestal and the glass bud vase stay by the window.", "现在爸爸坐在茶几尾端的小方凳上，面朝窗户；转椅空着，谁想看风景就坐过去。": "Dad is on the stool at the end of the coffee table now, facing the window; the swivel chair is free for whoever wants the view.", "¥25 圆盘小边几": "¥25 round-top table", "白色圆柱 Φ30": "White drum Φ30", "转椅和小方凳对调：卡萨驰转椅挪到茶几靠窗那头的右边（离右墙约 2.5cm、离茶几头约 3cm），默认斜对着沙发和窗户，一转就能看窗外。意式小方凳去转椅原来的位置（茶几靠餐厅那头），面朝茶几和窗户，比转椅窄 30cm，那头宽松了。窗边圆柱和玻璃小花瓶还在窗边，边几挪到餐厅那头，窗边不挤了。": "Swivel chair and stool swapped: the Casa swivel chair moves to the window end of the coffee table by the right wall (about 2.5 cm off the wall, about 3 cm past the table end), turned toward the sofa and the window so it can swing round to the view. The Italian stool takes the chair's old spot at the dining end of the coffee table, facing the table and the window; it's 30 cm narrower than the chair, so that end feels roomier. The window pedestal and the glass bud vase stay by the window; the side table moves to the dining end, so the window end isn't crowded.", "卡萨驰转椅 Φ77 现在在窗边这头：背靠右墙、斜对沙发和窗户，坐下转个身就是窗外的树；窗边只留转椅、窗边圆柱和落地灯，边几挪去餐厅那头了。": "The Casa swivel chair Φ77 is at the window end now: back to the right wall, turned toward the sofa and the window — sit down and swing round to the trees outside; only the chair, the window pedestal and the floor lamp stay by the window, the side table has moved to the dining end.", "¥25 圆盘小边几（台面 Φ18、高 58、方底座 18×18）放在沙发尾和小方凳之间的夹角：占地最小、看着轻，爸爸坐凳子左手边就能放杯子，沙发尾那个座位也够得着；台面小、只有一根细杆，杯子别放太满。": "The ¥25 round-top table (top Φ18, H58, square base 18×18) sits in the corner between the sofa end and the stool: the smallest footprint and light to look at; dad on the stool has it at his left hand and the end seat of the sofa can reach it too; the top is small on one thin pole, so don't fill the cup to the brim.", "主卧墙上不装阅读壁灯。": "No wall reading sconces in the master.", "R100": "R100", "标准深度": "Standard depth", "加深": "Deep", "圆角柜（厂家能做的柜型）：长方形 130 × 深 75，靠走道的两个前角用厂家的圆弧件，两边的门带圆弧边包住柜角；竖向分 40 + 50 + 40 三格，上下两节（门在 2m 高处分开），一共 6 扇门。柜门正面到对面墙约 1.57m；75 深已经能上下放两个 28 寸行李箱。": "Rounded-corner cabinet (a shape the factory can make): a 130 × 75 deep rectangle whose two front corners on the corridor side are the factory's arc pieces, the side doors wrapping the corners; split 40 + 50 + 40 across and in two tiers (doors split at 2 m), six doors in all. About 1.57 m from the door fronts to the opposite wall; 75 deep already takes two 28\" suitcases one above the other.", "圆角用 R150，转角柔和一些。": "Corners in R150: a softer turn.", "圆角用 R100，转角利落一些，柜里多一点地方。": "Corners in R100: a crisper turn and a little more room inside.", "门面竖条纹（奶白色），门缝藏在条纹凹槽里，看不出来。": "Vertically fluted doors (off-white); the door joints hide in the grooves.", "意式茶凳 80 长款（白色圈绒、焦糖色长靠枕，长 80、高 45，深度图上没写、按 40 估，淘宝 ¥295）+ 窗边圆柱。": "Italian boucle stool, 80 cm long version (white boucle, long caramel bolster, 80 long, 45 high, depth not given — taken as 40, Taobao ¥295) + the window pedestal.", "转椅和凳子对调：卡萨驰转椅挪到茶几靠窗那头的右边（离右墙约 2.5cm、离茶几头约 3cm），默认斜对着沙发和窗户，一转就能看窗外。80 长凳放在茶几靠餐厅那头、对着茶几中间，比茶几宽 27cm，两头各伸出十几厘米，能坐两个人；右边到墙的过道从约 68cm 变成约 60cm，夹角里的边几离长凳只剩几厘米。窗边圆柱和玻璃小花瓶还在窗边。": "Swivel chair and stool swapped: the Casa swivel chair moves to the window end of the coffee table by the right wall (about 2.5 cm off the wall, about 3 cm past the table end), turned toward the sofa and the window so it can swing round to the view. The 80 bench sits at the dining end of the coffee table, centred on it — 27 cm wider than the table, a dozen centimetres past each side, seats two; the aisle to the right wall goes from about 68 cm to about 60 cm, and the side table in the corner is only a few centimetres from the bench. The window pedestal and the glass bud vase stay by the window.", "80 长款竖着靠右墙放（离墙约 1.5cm），比小方凳往窗边挪了约 24cm，整条都在茶几靠窗那头外面，坐下伸腿不碰茶几。": "The 80 bench stands lengthwise against the right wall (about 1.5 cm off it), about 24 cm nearer the window than the stool, wholly past the window end of the table, so legs stretched out from it clear the table.", "80 长款在窗边要往右挪 9cm，和圆几只隔约 2cm；右边窗角要是也放落地灯就放不下了。": "By the window the 80 bench has to move 9 cm right, leaving only about 2 cm to the drum; with a floor lamp in the right-hand window corner as well it won't fit.", "放下": "Down", "主卧阳台和客厅阳台外沿各装一道 Zipblind（全遮光款，没有半遮光的），顶上是收卷盒。放下以后阳台封起来，挡雨、挡晒，阳台能当半个房间用：客厅阳台喝茶看书，主卧阳台放按摩椅或者运动，像多了两个小房间。": "A Zipblind on the outer edge of both the master and the living balcony (full blackout — there's no semi-blackout version), with the roller cassette at the top. Let down, the balconies close up against rain and sun and work like half a room each: tea and reading on the living balcony, the massage chair or exercise on the master balcony — like two more small rooms.", "现在显示：放下。全遮光，放下后外面的树就看不到了，白天阳台里也会比较暗。": "Shown now: down. Full blackout, so the trees outside disappear and the balconies are fairly dark even by day.", "0.9m 定制地台床：床架各 95×205，正好放宜家 90×200 的床垫；两床之间约 54cm，不放床头柜；地台床只有 22cm 高，孩子从床尾、床边上下都方便；床尾到衣柜还有约 89cm。": "0.9 m custom platform beds: frames 95×205 each, made to take IKEA 90×200 mattresses; about 54 cm between the beds, no bedside tables; the platforms are only 22 cm high, easy for the kids to get in and out at the foot or the side; about 89 cm from the bed ends to the wardrobe.", "Banxia 仿蚕丝花瓣吊灯 Φ60（奶油色仿蚕丝 + 铁艺，护眼暖光 60W，¥584.8；吊线 120cm 可调）：几片大花瓣叠成一朵压扁的半开花，挂在餐桌正上方，灯底离桌面约 73cm。餐桌是 140×85 的椭圆，Φ60 大约是桌宽的 2/3，比例最舒服，从客厅看过去也不挡视线。": "Banxia silk-look petal pendant Φ60 (cream silk-look fabric on iron, warm eye-care light 60W, ¥584.8; cord 120 cm, adjustable): big petals layered into a flattened half-open flower, right over the dining table, the bottom about 73 cm above the top. The table is a 140×85 oval and Φ60 is about two thirds of its width — the most comfortable proportion, and it doesn't block the view from the living room.", "C 淘宝侘寂风黑色松木整板自然边茶几（100×50×35，¥437，10 月 20 日晚 8 点双十一 ¥425；也有 120×55 的 ¥687）：一整块松木板，两条长边留着原木的波浪边，两块厚板腿，做旧拉丝黑。黑色和原来选的黑茶几一样，跟黑色餐椅框、藤编椅、浅色地毯、米白沙发、原木餐边柜都搭，比 Aminohome 更有自然感。比 Aminohome 短 13.5cm、矮 4cm，没有下层搁板放遥控器和书；松木偏软，磕到会露浅色印子；四个角是直角，宝宝跑来跑去最好贴防撞角。": "C Taobao wabi-sabi black pine live-edge coffee table (100×50×35, ¥437; ¥425 in the 11.11 sale from 8 pm on 20 Oct; also 120×55 at ¥687): one solid pine slab with both long edges left wavy, two thick slab legs, distressed wire-brushed black. The same black as the table you chose before, so it goes with the black dining-chair frames, the rattan chairs, the light rug, the cream sofa and the oak sideboard — more natural-feeling than the Aminohome. 13.5 cm shorter and 4 cm lower than the Aminohome, with no lower shelf for remotes and books; pine is soft and knocks show pale; the four corners are square — with the toddler running about, stick on corner guards.", "4 把椅子 + Stokke：长边两边各 2 把，Stokke 放靠厨房那头，靠餐边柜那头空着：桌子那头到柜子约 1m，开柜门、拉抽屉、冲咖啡都宽松，餐厅看起来也更空。一家四口坐 3 把 + Stokke，还多 1 把给客人；人多时把客厅的小方凳搬过来。": "4 chairs + Stokke: two on each long side, the Stokke at the kitchen end, the sideboard end left free: about 1 m from the table's end to the cabinet, so doors, drawers and pour-over coffee have room, and the dining room looks emptier. The four of you use 3 chairs + the Stokke, leaving 1 for a guest; with more people, bring over the living-room stool.", "亚克力透明边几（宽 40）：两边空位各只有约 35cm，只能放窗边一个；床往衣柜那边挪约 8cm，衣柜那边留约 27cm，放不下柜子。中间一层放一个带盖的小藤编收纳盒（约 20×18×11），充电线、耳机、护手霜这些小东西收进去，看着不乱；充电线用白色或透明的，插线板放在柜子后面地上。手机放在台面靠床那边充电，线从后面垂下去。台面高 50，比床垫面只低几厘米，晚上摸手机顺手。": "Clear acrylic table (40 wide): each side has only about 35 cm, so just one, by the window; the bed moves about 8 cm toward the wardrobe, leaving about 27 cm on that side — no cabinet fits there. A small lidded woven-rattan box (about 20×18×11) sits on the middle shelf for the chargers, earphones, hand cream and such, so it doesn't look messy; use a white or clear charging cable, with the power strip on the floor behind the table. The phone charges on the bed side of the top, its cable dropping down the back. The top is 50 high, only a few centimetres below the mattress — easy to reach the phone at night.", "床头不放台灯，先用自己的鸡蛋形小夜灯（磨砂白，约 8×11cm），放在台面靠墙那头，晚上一点暖光。": "No bedside lamp: your own egg-shaped night light for now (frosted white, about 8×11 cm) at the wall end of the top, a little warm glow at night.", "胡桃木色 50mm 木百叶，装在书房和孩子房的窗。主卧阳台门不装：阳台外沿有全遮光 Zipblind，要遮光、挡视线时放下来就行，平时门口通透。": "Walnut-colour 50 mm wooden blinds on the study and kids' room windows. None on the master balcony door: the full-blackout Zipblind on the balcony edge comes down for shade or privacy; otherwise the doorway stays open and light.", "胡桃木色 50mm 木百叶：书房、孩子房的窗，加上主卧阳台门三扇各一幅。": "Walnut-colour 50 mm wooden blinds: the study and kids' room windows, plus one on each of the three master balcony door leaves.", "仿洞石罗马柱边几 A 款（淘宝 ¥280，20 日晚 8 点立减 15% 约 ¥238：直径 34、高 44，上面一圈平顶、下面一圈底座，中间竖条纹，约 8kg）：米黄洞石纹，和白墙、米白沙发、原木色都搭，比白色圆柱有质感，上面放迷你花瓶和兰花刚好。同店 B 款直径 36、高 41，整根竖条纹，样子差不多。": "Faux-travertine Roman column side table, style A (Taobao ¥280, about ¥238 with 15% off from 8 pm on the 20th: 34 across, 44 high, a plain cap and foot band with vertical fluting between, about 8 kg): beige travertine veining that goes with the white walls, the cream sofa and the oak tones — more texture than the white drum, and just right for the mini vase and orchid. Style B from the same shop is 36 across, 41 high, fluted all the way — much the same look.", "中古风白杨树瘤木圆柱（淘宝 ¥425 起：直径 30、高 50，和原来的白色圆柱一样大）：浅蜜色树瘤纹带一点棕，和焦糖色靠枕、小方凳、黑胡桃木都呼应；木头怕水，花瓶下面垫个小托盘。也有高 80 的，可以当花架。": "Mid-century burl-poplar cylinder (Taobao from ¥425: 30 across, 50 high, the same size as the white drum): light honey burl figure with a touch of brown, echoing the caramel bolster, the little stool and the black walnut; wood dislikes water, so put a small tray under the vase. There is an 80 high one too, as a plant stand.", "仿洞石圆柱边几（淘宝 ¥389.8，双十一 ¥305.8；截图上没看到尺寸，先按直径 35、高 45 建模，下单前看一下规格）：最简洁的一根圆柱，洞石纹比罗马柱安静。": "Faux-travertine drum side table (Taobao ¥389.8, ¥305.8 in the 11.11 sale; no size in the screenshot, modelled 35 across and 45 high — check the listing before ordering): the simplest plain drum, the travertine quieter than the Roman column.", "白色圆柱 Φ30（高 50）放进夹角：实心最稳，碰不倒；Φ30 放进这个夹角刚好贴着沙发尾和凳子侧边，放得下、不算太宽，只是看起来比圆盘小边几实、占的地方多一点。": "The white drum Φ30 (H50) in the corner: solid, the steadiest, won't tip; at Φ30 it just touches the sofa end and the stool's side — it fits and isn't too wide, it just looks more solid than the round-top table and takes a bit more room.", "宜家 BRIMNES 坐卧两用床（白色，长 205、宽 87、高 58，两头是矮挡板、没有靠背；两张 80×200 床垫，平时叠在一起当单人床，拉开后并排，床面宽 168；2 个大抽屉，里面 85×54×16）：靠右墙放、一头贴窗，58 高的挡板不太挡窗。不拉开就能直接午睡；床边到书桌约 84cm，椅子照常用（坐着时椅背离床边只剩十几厘米）。抽屉拉满只要约 54cm：椅子在原位时只能拉开约 10–27cm，把椅子推到床尾就能拉满。": "IKEA BRIMNES day-bed (white, 205 long, 87 wide, 58 high, low end panels and no back; two 80×200 mattresses, stacked as a single day to day and side by side when pulled out, 168 wide; two big drawers, 85×54×16 inside): against the right wall, one end at the window — the 58 cm end panel hardly blocks the window. Nap on it straight away without pulling anything out; about 84 cm from the bed edge to the desk, so the chairs work as usual (seated, the chair back is only a dozen-odd cm from the bed). The drawers need only about 54 cm to open fully: with the chairs where they are they open about 10–27 cm; roll the chairs to the foot of the bed and they open all the way.", "现在显示：拉开成双人（床面宽 168）。床边离书桌只剩约 3cm（很近，但碰不到），两把椅子得先搬走；从床尾上下床，床尾到衣柜约 89cm。拉开时床架挡在抽屉前面，抽屉打不开。": "Shown now: pulled out to a double (168 wide). The bed edge comes to only about 3 cm from the desk (close, but clear), so both chairs have to go first; get in and out at the foot, about 89 cm from the wardrobe. Pulled out, the base stands in front of the drawers, so they can't be opened.", "现在：玄关顶天柜、书房窗台柜和书房搁板都是墙色的暖白，跟墙融在一起，存在感最低。": "As now: the entrance cabinet, the study window seat and the study shelves are the warm white of the walls — they melt into the walls.", "米色：跟开发商厨房柜门同一个香槟米色。玄关柜、书房窗台柜和搁板换成米色，跟厨房、原装鞋柜是一套，看起来像跟房子一起做的；比白色温暖，轻法式的感觉更明显。（只是这里先模拟，定了再告诉定制页面。）": "Beige: the same champagne beige as the developer's kitchen doors. With the entrance cabinet, the study window seat and the shelves in beige, they read as one set with the kitchen and the original shoe cabinet — as if built with the flat; warmer than white, more light-French. (Simulated here first; the Carpentry page follows once decided.)", "暖灰：跟开发商原装衣柜同一类暖灰。更沉稳、耐脏，跟黑色餐椅、深色台面更配；但在米色地砖、白墙中间会比米色重一点。（只是这里先模拟，定了再告诉定制页面。）": "Warm grey: the same kind of warm grey as the developer's built-in wardrobes. Calmer and more forgiving of marks, closer to the black chairs and the dark worktop; but against the ivory floor and white walls it is a little heavier than beige. (Simulated here first; the Carpentry page follows once decided.)", "整扇门": "Full door", "靠餐厅那一格也是整扇门，全部封闭。": "The dining-end bay has full doors too, all closed.", "稍微加深": "A little deeper", "圆角柜，稍微加深：长方形 130 × 深 85（标准是 75），前角照样用厂家的圆弧件，一共 6 扇门。柜门正面到对面墙约 1.47m（标准是 1.57m），过道还是宽松的；每格多 10cm 深，中间那格错开放得下 3 个高尔夫球包。": "Rounded corners, a little deeper: 130 × 85 deep (standard 75), the factory's arc pieces on the front corners as before, 6 doors. About 1.47 m from the doors to the opposite wall (1.57 m standard) — the passage stays comfortable; each bay gains 10 cm, and the middle bay takes three golf bags staggered.", "进门那格上下放两个 28 寸行李箱。": "The entrance-end bay takes two 28-inch suitcases, one above the other.", "打开柜门看：靠餐厅那格台面下面是一扇矮门，里面一层隔板，放零食、杯子和咖啡豆，当餐边柜用；台面上和开放格放碗。原来在这格的清洁用品（吸尘器和充电座、拖把桶、熨衣板）搬到进门那头那一格，那里也要留插座。": "Doors open: below the ledge the dining-end bay has a low door with one shelf inside for snacks, cups and coffee beans — the sideboard's job; the bowls go on the ledge and the open shelves. The cleaning kit that was in this bay (vacuum and dock, mop bucket, ironing board) moves to the entrance-end bay, which then needs the socket.", "沙发靠右": "Sofa on the right", "沙发靠左（原来的摆法）": "Sofa on the left (the original)", "沙发靠左（原来的摆法）：站在餐厅往阳台看，沙发在左边那面墙，按阳台推拉门开在左边来留去阳台的路。": "Sofa on the left (the original): looking from the dining room toward the balcony, the sofa is on the left-hand wall, with the way to the balcony kept for a sliding panel on the left.", "4 块隔板": "4 boards", "玄关柜": "Entrance cabinet", "沙发靠右：站在餐厅往阳台看，沙发在右边那面墙。整个客厅左右镜像——沙发、茶几、转椅、电视位、落地灯、窗边茶凳和花几都对调，去阳台的路换到另一边。墙、窗户、天花上的灯不动（轨道射灯会重新对准茶几和转椅）。原来的摆法是按推拉门开在左边留路的，这样就是按开在右边留路；小方凳往客厅里挪了约 46cm，凳子背后跟那面墙的墙头齐，客厅和餐厅之间有了边界，夹角里的边几跟着挪。下面各项说明里写的“左 / 右”，镜像后要反过来看。": "Sofa on the right: looking from the dining room toward the balcony, the sofa is on the right-hand wall. The whole living room is mirrored left-right — sofa, coffee table, swivel chair, TV spot, floor lamp, window stool and pedestal all swap sides, and the way to the balcony moves to the other side. Walls, windows and ceiling lights stay (the track spots re-aim at the coffee table and the chair). The original layout kept the way out for a sliding panel on the left; this one keeps it for a panel on the right; The stool moves about 46 cm into the room, its back level with the end of the wall, so the living room has an edge against the dining room; the corner piece follows. Where the notes below say left / right, read them the other way round.", "树瘤圆柱和黑色小边几对调：树瘤圆柱（焦糖黄）挪到沙发尾和小方凳之间的夹角，跟凳子的焦糖色靠枕放在一起，黄色集中在一处，沙发尾的人和坐凳子的人都能放杯子；黑色小边几去窗边，上面放那一枝紫色兰花，窗边只留这一枝花。": "Burl pedestal and black side table swapped: the burl cylinder (caramel yellow) goes to the corner between the sofa's end and the stool, beside the stool's caramel bolster — the yellows together, and both the sofa-end seat and the stool can put a cup on it; the black side table goes to the window with the one purple orchid stem — the only flower by the window.", "靠餐厅那一格开放：正面、柜角的圆弧件和垂直于墙、朝餐厅的那块侧板都只做到台面高度（跟着餐边柜；不放餐边柜就做 85cm），下面是柜门放零食、杯子；台面以上不装门，从餐厅看进去深 40，跟餐边柜一样深，宽就是柜深（标准 75，加深 85）。其余几格照样储物。（只在这里先模拟，定了再告诉定制页面。）": "The dining-end bay opens up: its front, the rounded corner piece and the end panel square to the wall (facing the dining room) stop at the ledge (level with the sideboard's top; 85 cm with no sideboard), doors below for snacks and cups; above, no doors — 40 deep seen from the dining room, the depth of a sideboard, and as wide as the cabinet is deep (75 standard, 85 deeper). The other bays keep their storage. (Simulated here first; the Carpentry page follows once decided.)", "台面以上 4 块隔板：第一格留高 55cm（水壶、香蕉架、吃饭时挪过来的兰花都放得下），上面每格约 34cm，跟书架差不多；最上面一块离地约 2.43m，手够不着，放不常动的东西——图里放了一幅你以后自己画的小画和一瓶干枝。": "Four boards above the ledge: the first gap 55 cm tall (jug, banana stand and the orchid moved over during meals all fit), the rest about 34 cm, like a bookcase; the top board is about 2.43 m up, out of reach — for things that seldom move: the picture shows one of your future paintings and a vase of dried branches.", "台面以上 5 块隔板：第一格一样 55cm，上面每格约 28cm，碗一层一摞正好；最上面一块离地约 2.5m，一样放画和干枝这类不常动的。": "Five boards above the ledge: the first gap again 55 cm, the rest about 28 cm — one stack of bowls per board; the top board about 2.5 m up, again for a painting or dried branches.", "打开柜门看：跟定制页面的内部一样——靠餐厅那格是清洁格（吸尘器和充电座、拖把桶、熨衣板、清洁剂），中间那格放高尔夫球包和一箱补充装，上面两层放瓶瓶罐罐。": "Doors open: the same inside as on the Carpentry page — the dining-end bay is the cleaning bay (vacuum on its dock, mop bucket, ironing board, detergents), the middle bay holds golf bags and a bin of refills with bottles on two shelves above.", "中间那格放 2 个高尔夫球包。": "The middle bay takes two golf bags.", "2m 以上中间那格平放 2 个 28 寸大箱子。": "Above 2 m the middle bay takes two 28-inch cases lying flat.", "2m 以上中间那格平放 2 个 26 寸大箱子（28 寸长 76，标准深度放不进，要加深）。": "Above 2 m the middle bay takes two 26-inch cases lying flat (a 28-inch is 76 long — it needs the deeper cabinet).", "2m 以上中间那格平放 2 个 24 寸箱子（再大的放不进）。": "Above 2 m the middle bay takes two 24-inch cases lying flat (nothing bigger fits).", "进门那格下面站着放 2 个 28 寸大箱子。": "Two 28-inch cases stand in the entrance-end bay.", "2m 以上再平放 1 个 20 寸小箱子；你家另外 2 个大箱子、1 个小箱子放衣柜。": "One 20-inch case lies flat above 2 m as well; the other two large cases and one small go in the wardrobe.", "20 寸小箱子这款柜子里没地方，跟另外 2 个大箱子、1 个小箱子一起放衣柜。": "No room for the 20-inch case in this cabinet — it goes in the wardrobe with the other two large and one small.", "中间那格错开放得下 3 个高尔夫球包。": "The middle bay takes three golf bags staggered.", "走廊": "Corridor", "柜里的分层降到 1.94m，上面不放纸巾夹层，箱子竖着放：两扇门那格并排站 3 个 28 寸，进门那格再站 1 个——4 个大箱子都放进玄关柜，2 个小箱子放衣柜。": "The fixed shelf drops to 1.94 m and the paper layer goes, so the cases stand upright: three 28-inch side by side in the two-door bay and one more in the entrance-end bay — all four large cases in the entrance cabinet, the two small ones in the wardrobe.", "柜里的分层降到 1.94m，上面不放纸巾夹层，箱子竖着放：两扇门那格并排站 2 个 28 寸，进门那格再站 1 个——3 个大箱子放玄关柜，另外 1 个大的和 2 个小的放衣柜。": "The fixed shelf drops to 1.94 m and the paper layer goes, so the cases stand upright: two 28-inch side by side in the two-door bay and one in the entrance-end bay — three large cases here, the fourth and the two small ones in the wardrobe.", "进门那格下面站着放 2 个 28 寸；分层降到 1.94m、上面不放纸巾夹层，两扇门那格再竖放 2 个——一共 4 个大箱子，2 个小箱子放衣柜。": "Two 28-inch cases stand in the entrance-end bay; with the fixed shelf at 1.94 m and no paper layer, two more stand upright in the two-door bay — four large cases in all, the two small ones in the wardrobe.", "加宽到墙边：柜子往餐厅那头加长 25.5cm，端面跟旁边那面墙的墙面齐平（总长约 155）。开放格还是 40 深，后面三扇门各宽约 38：靠开放格的两扇门里面是一整格（不加竖隔板），进门那扇单独一格。": "Widened to the wall's edge: the cabinet grows 25.5 cm toward the dining room, its end flush with the wall beside it (about 155 long). The open bay stays 40 deep; behind it three doors about 38 wide: the two next to the open bay share one bay (no partition), the entrance-end door has its own.", "加长：柜子往餐厅再伸出 40cm（沿墙总长约 196），开放格从柜子的圆角一直
