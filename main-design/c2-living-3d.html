<style>
/* Layout: full-bleed 3D view of the flat; a slim control sheet floats over the lower-left corner (bottom strip on phones). */
:root {
  --bg: #e4e2dc;
  --panel: rgba(250, 248, 244, 0.46);
  --panel-solid: rgba(250, 248, 244, 0.46);
  --fg: #23211e;
  --muted: #6d6860;
  --line: rgba(35, 33, 30, 0.14);
  --accent: #4f6b5c;
  --font-ui: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c1a; --panel: rgba(30, 31, 29, 0.46); --panel-solid: rgba(30, 31, 29, 0.46); --fg: #ecebe6; --muted: #a29d94;
    --line: rgba(236, 235, 230, 0.16); --accent: #8fb39f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1c1a; --panel: rgba(30, 31, 29, 0.46); --panel-solid: rgba(30, 31, 29, 0.46); --fg: #ecebe6; --muted: #a29d94;
  --line: rgba(236, 235, 230, 0.16); --accent: #8fb39f; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.sheet {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(394px, calc(100% - 32px)); box-sizing: border-box; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 16px; display: grid; gap: 11px;
  max-height: calc(100% - 230px); overflow-y: auto;
}
.head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  position: sticky; top: -14px; z-index: 2; margin: -14px -16px 0; padding: 14px 16px 6px; background: none; border-radius: 10px 10px 0 0;
}
.head .btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; flex: none; max-width: 62%; }
#fold { flex: none; font-size: 12px; padding: 4px 10px; }
.langs { display: flex; gap: 3px; flex: none; }
.langs .seg { font-size: 12px; padding: 4px 7px; }
.sheet.min { gap: 0; }
.sheet.min .head { padding-bottom: 14px; margin-bottom: -14px; }
.sheet.min .sub { display: none; }
.sheet h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; text-wrap: balance; }
.sheet .sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-family: var(--font-data); }
.group { display: grid; gap: 6px; }
.label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
button.seg {
  font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
}
button.seg[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button.seg:disabled { opacity: 0.38; cursor: not-allowed; }
button.chip {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; cursor: pointer;
  padding: 4px 9px 4px 5px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg);
}
button.chip i { width: 16px; height: 16px; border-radius: 50%; display: block; border: 1px solid var(--line); }
button.chip[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { margin: 0; font-size: 11px; line-height: 1.55; color: var(--muted); }
.fold { font: inherit; font-size: 12px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; justify-self: start; }
.sheet.min .group, .sheet.min .note { display: none; }
.viewbar {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; max-width: calc(100% - 32px); box-sizing: border-box;
  display: grid; gap: 6px; padding: 8px 10px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px;
}
.viewbar .label { flex: none; padding-top: 5px; }
.vrow { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.vrow .label { min-width: 2.2em; }
.ctx { display: grid; gap: 5px; padding-top: 6px; border-top: 1px solid var(--line); min-width: 0; }
.ctx[hidden], .ctx .row[hidden], #views .row[hidden] { display: none; }
.viewbar.min .ctx { display: none; }
.walkhud { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(760px, calc(100% - 32px)); box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 14px; background: var(--panel); box-shadow: 0 4px 18px rgba(0,0,0,.18); z-index: 4; }
.walkhud .walkroom { font-size: 16px; font-weight: 600; min-width: 4.5em; }
.walkhud input[type=range] { flex: 1; min-width: 80px; accent-color: #1d1b19; }
.walkhud .walktime { font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
body.walking > :not(#view):not(#walkHud) { display: none !important; }
.walkhud[hidden] { display: none; }   /* the player strip only while walking (display: flex above would override [hidden]) */
.walkhud .walklang { display: flex; gap: 4px; }
@media (max-width: 560px) { .walkhud { flex-wrap: wrap; } .walkhud input[type=range] { order: 9; flex-basis: 100%; } }
.panpad { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); gap: 2px; z-index: 2; }
.panpad .seg { width: 34px; height: 34px; padding: 0; border-radius: 50%; background: var(--panel); display: grid; place-items: center; }
.panpad svg { width: 14px; height: 14px; display: block; }
#pan-u { grid-area: 1 / 2; } #pan-l { grid-area: 2 / 1; } #pan-r { grid-area: 2 / 3; } #pan-d { grid-area: 3 / 2; }
#areas .sep { flex: none; width: 1px; align-self: stretch; margin: 3px 3px; background: var(--line); }
.ctx .cap { margin: 0; font-size: 12px; color: var(--muted); width: 0; min-width: 100%; }   /* wraps to the buttons' width, never widens the panel */
.ctx .sep, .sheet .sep { flex: none; width: 1px; align-self: stretch; margin: 3px 3px; background: var(--line); }
.viewbar .row { gap: 5px; }
.viewbar button.seg { font-size: 12px; padding: 4px 9px; }
.rl { font-size: 12px; opacity: 0.7; align-self: center; margin-right: 2px; }
@media (max-width: 900px) {
  .viewbar .row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .viewbar button.seg { flex: none; }
}
@media (max-width: 520px) {
  .viewbar { left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); max-width: none; padding: 6px 8px; }
  .sheet { left: 12px; right: 12px; width: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 12px; gap: 9px; max-height: 48%; }
  .head { top: -12px; margin: -12px -12px 0; padding: 12px 12px 6px; }
  .panpad { left: 10px; bottom: auto; top: 50%; transform: translateY(-50%); }   /* phone: the sheet takes the bottom */
  .head { flex-wrap: wrap; row-gap: 8px; } .head .btns { max-width: none; justify-content: flex-start; }   /* phone: the buttons go under the title */
  .sheet.min .head { padding-bottom: 12px; margin-bottom: -12px; }
}
/* 2026-10-25 (the user found the page messy, spread over three places): the whole-flat switches in a slim bar at the top
   left, every room's views and choices in one panel down the right under small headings (long notes behind a notes button),
   the free arrangement under the bar on the left */
.sheet { left: 16px; right: auto; top: calc(16px + env(safe-area-inset-top, 0px)); bottom: auto; width: auto; max-width: min(452px, calc(100% - 480px));
  padding: 8px 10px; gap: 6px; max-height: none; overflow: visible; }
.sheet .head { position: static; margin: 0; padding: 0; align-items: center; background: none; }
.sheet h1 { font-size: 14px; }
.sheet .sub, #fold { display: none; }
.sheet .group { display: flex; flex-wrap: wrap; gap: 5px 10px; }
.sheet .group .row { flex-wrap: nowrap; gap: 3px; }
.sheet button.seg { font-size: 12px; padding: 3px 8px; }
.viewbar { width: min(420px, calc(100% - 32px)); max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; align-content: start; }
.viewbar .sec { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; padding-top: 6px; border-top: 1px dashed var(--line); }
.viewbar .ctx > .sec:first-child { border-top: 0; padding-top: 0; }
.viewbar .slot, #frmStool { display: contents; }
.viewbar .ctx .rl { min-width: 4.6em; }
.viewbar:not(.notes) .cap.long { display: none; }
.ctx p.cap.bad { color: #c0392b; }
@media (min-width: 521px) { .viewbar .row { flex-wrap: wrap; overflow: visible; } }
@media (max-width: 520px) {
  .sheet { left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); bottom: auto; max-width: none; max-height: none; padding: 6px 8px; gap: 5px; }
  .sheet .group { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .sheet .group .row { flex: none; }
  .viewbar { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 12px; right: 12px; width: auto; max-height: 44%; }
}
.viewbar { width: min(450px, calc(100% - 32px)); }
#areas { gap: 4px; } #areas .seg { padding: 4px 6px; } #areas .sep { margin: 3px 1px; }
.viewbar .ctx .row:has(> .rl:first-child) { position: relative; padding-left: 5.4em; }
.viewbar .ctx .row:has(> .rl:first-child) > .rl:first-child { position: absolute; left: 0; top: 5px; width: 5.1em; min-width: 0; margin: 0; line-height: 1.25; }
@media (max-width: 520px) { .panpad { top: 40%; } .viewbar { width: auto; } .viewbar .ctx .row:has(> .rl:first-child) { padding-left: 0; } .viewbar .ctx .row:has(> .rl:first-child) > .rl:first-child { position: static; width: auto; flex: none; } }
/* 2026-10-25: one panel down the left (the bar, the rooms, the free arrangement), the pan pad bottom right */
.dock { position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); width: min(400px, calc(100% - 32px)); max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; z-index: 5;
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); }
.dock > .sheet, .dock > .viewbar, .dock > .freebox { position: static; width: auto; max-width: none; max-height: none !important; overflow: visible; background: none; border: 0; border-radius: 0;
  -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
.dock > .viewbar, .dock > .freebox { border-top: 1px solid var(--line); }
.dock #fold { display: inline-block; }
.dock:has(.sheet.min) > .viewbar, .dock:has(.sheet.min) > .freebox { display: none; }
.panpad { left: auto; right: 16px; }
@media (max-width: 520px) {
  .dock { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 12px; right: 12px; width: auto; max-height: 46%; }
  .panpad { left: auto; right: 10px; top: 30%; }
}
.dock { background: rgba(250, 248, 244, 0.3); -webkit-backdrop-filter: blur(5px) saturate(1.1); backdrop-filter: blur(5px) saturate(1.1); }
:root[data-theme="dark"] .dock { background: rgba(30, 31, 29, 0.3); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dock { background: rgba(30, 31, 29, 0.3); } }
</style>

const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function frame(now) {

    camera.position.lerpVectors(anim.from.p, anim.to.p, e);
    controls.target.lerpVectors(anim.from.t, anim.to.t, e);
    camera.fov = anim.from.f + (anim.to.f - anim.from.f) * e; camera.updateProjectionMatrix();
    if (k === 1) anim = null;

l behind the door: a plain white round stool, Φ40, 45 high, against the wall — sit down to put shoes on, takes almost no room; the entrance passage keeps about 1.6 m and the fully open front door clears it. Shoes go in the cabinet on the left as you come in.", "放在窗边，右边去阳台留 70cm。": "placed by the window; 70 cm left on the right to the balcony.", "这个方向转椅在餐厅那头（后面就是进客厅的路，不能放东西）。": "In this direction the swivel chair is at the dining end (the way into the living room is right behind it).", "窗边只放转椅。": "Only the swivel chair by the window.", "银翼 V 脚支架放在客厅靠窗的右边墙角，斜 45° 对着沙发中间，屏幕离沙发约 2.2m。右边窗角那盏落地灯原地不动，正好在电视后面，晚上当电视背光。阳台门在左边，电视不挡门；要挪电视时推开就行（带轮子）。": "Silver Wing stand in the living room's right window corner, angled 45° toward the middle of the sofa, about 2.2 m from the sofa. The floor lamp in that corner stays put — it ends up behind the TV and works as a backlight at night. The balcony door is on the left, so the TV doesn't block it; roll it aside if needed (it has wheels).", "做": "Yes", "C2 - 家具": "C2 - Furniture", "内部结构、开门的样子和尺寸，看单独的「Carpentry」页面。": "Inside layout, open doors and dimensions: see the separate \"Carpentry\" page.", "竖条纹": "Fluted", "门面平滑、跟墙同色，门缝是几条细线。": "Smooth doors in the wall colour; the door gaps show as a few hairlines.", "照孩子现在自己摆的样子，直接摆在地板上（不铺垫子）：床尾和衣柜之间那块空地的左半边，靠左墙停一排小汽车，旁边用深绿和白色的积木条围一条车道；中间一座三层的磁力片停车楼；右边用原木长条积木围成两条弯道，绕一个大 U 形掉头，车道里排着小汽车、一辆双层巴士和一列小火车；墙角堆着备用的磁力片。右半边从门口到床的路还是约 1.05m（右墙布盒子那段约 70cm）。他的 4 个毛绒放在左边床的床头：黄色小鸡（红鸡冠）、卡皮巴拉、Roblox 公仔、绿色毛毛头小鸟；右边床还是恐龙。两个带盖的布盒子：一个在两张床头中间当床头柜，一个靠右墙收玩具。": "Set up the way he builds it himself, straight on the floor (no mat): on the left half of the free floor between the bed ends and the wardrobe, a row of toy cars parked along the left wall beside a lane edged with dark-green and white blocks; a three-storey magnetic-tile garage in the middle; on the right, two curving lanes edged with plain wooden planks that turn round in a big U, with cars, a double-decker bus and a little train lined up in them; spare magnetic tiles stacked in the corner. On the right, the way in from the door to the beds stays about 1.05 m (about 70 cm past the fabric box by the right wall). His four plush toys sit at the head of the left bed: the yellow chicken (red comb), the capybara, the Roblox plush and the green bird with fuzzy hair; the dinosaur stays on the right bed. Two fabric boxes with lids: one between the bed heads as a bedside table, one against the right-hand wall for toys.", "电视放在客厅窗角时，这块地方被电视占了，凳子先不显示。": "With the TV in the living-room window corner this spot is taken by the TV, so the stool is hidden for now.", "cm（稍挤）。黑色小边几一个，在转椅内侧（靠窗、靠墙那边）放杯子。": " cm (a bit tight). The small black side table on the chair's inner side (toward the window and the wall) for a cup.", "转椅在窗边，面向沙发；黑色小边几在旁边（伸手能放杯子），就是参考图": "The swivel chair is by the window facing the sofa; the small black side table beside it (within reach for a cup); the reference photo's ", "转椅 + 黑色小边几，灯放在边几后面。": "Swivel chair + the small black side table, lamp behind the side table.", "现在爸爸（180）坐在凳子上，妈妈和大孩子坐沙发；座高 45 和沙发差不多，脚不碰茶几。": "Dad (180) is on the stool now, mum and the older child on the sofa; the 45 cm seat is about sofa height and his feet stay clear of the coffee table.", "牧森 2.4m：1.8m 的爸爸躺直，头和脚两头各只剩十几厘米，刚好躺得下，不算宽裕；想把腿完全伸直放松的话还是 3.2m 的舒服。": "Musen 2.4 m: with dad (1.8 m) lying flat only a dozen or so centimetres are left at each end — he just fits, but it isn't roomy; to stretch the legs out fully the 3.2 m is the comfortable one.", "显示人物时宝宝要坐 Stokke，所以先换成 5 把 + Stokke；人物选「不显示」就是 6 把。": "With people shown the little one sits in the Stokke, so it's 5 chairs + Stokke for now; set people to \"None\" for 6 chairs.", "这个沙发靠窗那头离玻璃很近，凳子和圆几只能放在沙发头和右边落地灯之间（约 1.1m）：圆几离沙发头约 25cm，凳子和圆几隔开约 10cm。": "This sofa's window end comes close to the glass, so the stool and drum have to sit between the sofa end and the right-hand floor lamp (about 1.1 m): the drum about 25 cm from the sofa end, about 10 cm between drum and stool.", "组合2 弧形沙发 3.2m：1.8m 的爸爸躺直，头那头离扶手还有约 40cm，脚边还空出将近 1m，腿完全伸在贵妃位上，很宽裕。": "Combo 2 curved sofa 3.2 m: with dad (1.8 m) lying flat there's still about 40 cm to the arm at his head and nearly 1 m free past his feet; his legs stretch right out on the chaise — plenty of room.", "牧森 2.4m 短很多，沙发头离窗还有约 1m，所以凳子和圆几往里挪到窗户中间一带：凳子大致对着茶几，圆几在左边、隔开约 20cm，右边落地灯旁边空出来。": "The Musen 2.4 m is much shorter — its end stops about 1 m short of the window — so the stool and drum move in toward the middle of the window: the stool roughly facing the coffee table, the drum on its left about 20 cm away, and the space beside the right-hand lamp left open.", "黑色平衡臂环形灯": "Black balance-arm ring lamp", "现在是一盏，放在左边窗角（沙发靠窗那头），灯头朝中间探到沙发那头上方，坐沙发看书正好。": "One lamp now, in the left window corner (the sofa's window end), the head reaching over the end of the sofa — right for reading on the sofa.", "现在是一盏，放在右边窗角，灯头朝中间探到窗边凳子上方；左边沙发那头的窗角空着。": "One lamp now, in the right window corner, the head reaching over the window stool; the left corner by the sofa stays empty.", "床头柜": "Bedside table", "放窗边": "By the window", "意式茶凳（米白圈绒，焦糖色圆靠枕，宽 47、深 37、高 45，底下 8cm 内缩底座）+ 窗边圆柱。": "Italian stool (off-white boucle, caramel round bolster, 47 wide, 37 deep, 45 high, on an 8 cm recessed plinth) + the window pedestal.", "凳子在窗边，背靠窗、面朝茶几，圆几在左边。": "The stool is by the window, back to the glass, facing the coffee table, with the drum on its left.", "电视放在客厅右墙时，茶几对面被电视占了，凳子先放回窗边。": "With the TV on the living-room right wall the spot across the coffee table is taken, so the stool goes back by the window.", "现在爸爸坐在凳子上，隔着茶几对着沙发上的妈妈和大孩子。": "Dad is on the stool now, across the coffee table from mum and the older child on the sofa.", "凳子挪到黑色茶几对面，背靠右墙（离墙约 1cm），面朝沙发，焦糖色靠枕在后面当靠背；和沙发、转椅围成一圈，聊天都面对面。凳子放在茶几靠窗那头的外侧，坐下伸腿正好在茶几头外面（离茶几约 3cm），不会顶到茶几；这一侧就不走人了，去窗边从沙发和茶几中间过。窗边圆柱和玻璃小花瓶留在窗边。": "The stool moves across the black coffee table, back to the right wall (about 1 cm off), facing the sofa, the caramel bolster behind as a backrest; with the sofa and the swivel chair it closes the circle, everyone face to face. The stool sits just past the window end of the coffee table, so legs stretched out from it land beyond the end of the table (about 3 cm clear) instead of hitting it; nobody walks along this side any more — to reach the window, go between the sofa and the coffee table. The window pedestal and the glass bud vase stay by the window.", "现在爸爸坐在茶几尾端的小方凳上，面朝窗户；转椅空着，谁想看风景就坐过去。": "Dad is on the stool at the end of the coffee table now, facing the window; the swivel chair is free for whoever wants the view.", "转椅和小方凳对调：卡萨驰转椅挪到茶几靠窗那头的右边（离右墙约 2.5cm、离茶几头约 3cm），默认斜对着沙发和窗户，一转就能看窗外。意式小方凳去转椅原来的位置（茶几靠餐厅那头），面朝茶几和窗户，比转椅窄 30cm，那头宽松了。窗边圆柱和玻璃小花瓶还在窗边，边几挪到餐厅那头，窗边不挤了。": "Swivel chair and stool swapped: the Casa swivel chair moves to the window end of the coffee table by the right wall (about 2.5 cm off the wall, about 3 cm past the table end), turned toward the sofa and the window so it can swing round to the view. The Italian stool takes the chair's old spot at the dining end of the coffee table, facing the table and the window; it's 30 cm narrower than the chair, so that end feels roomier. The window pedestal and the glass bud vase stay by the window; the side table moves to the dining end, so the window end isn't crowded.", "主卧墙上不装阅读壁灯。": "No wall reading sconces in the master.", "R100": "R100", "标准深度": "Standard depth", "加深": "Deep", "圆角柜（厂家能做的柜型）：长方形 130 × 深 75，靠走道的两个前角用厂家的圆弧件，两边的门带圆弧边包住柜角；竖向分 40 + 50 + 40 三格，上下两节（门在 2m 高处分开），一共 6 扇门。柜门正面到对面墙约 1.57m；75 深已经能上下放两个 28 寸行李箱。": "Rounded-corner cabinet (a shape the factory can make): a 130 × 75 deep rectangle whose two front corners on the corridor side are the factory's arc pieces, the side doors wrapping the corners; split 40 + 50 + 40 across and in two tiers (doors split at 2 m), six doors in all. About 1.57 m from the door fronts to the opposite wall; 75 deep already takes two 28\" suitcases one above the other.", "圆角用 R150，转角柔和一些。": "Corners in R150: a softer turn.", "圆角用 R100，转角利落一些，柜里多一点地方。": "Corners in R100: a crisper turn and a little more room inside.", "门面竖条纹（奶白色），门缝藏在条纹凹槽里，看不出来。": "Vertically fluted doors (off-white); the door joints hide in the grooves.", "意式茶凳 80 长款（白色圈绒、焦糖色长靠枕，长 80、高 45，深度图上没写、按 40 估，淘宝 ¥295）+ 窗边圆柱。": "Italian boucle stool, 80 cm long version (white boucle, long caramel bolster, 80 long, 45 high, depth not given — taken as 40, Taobao ¥295) + the window pedestal.", "转椅和凳子对调：卡萨驰转椅挪到茶几靠窗那头的右边（离右墙约 2.5cm、离茶几头约 3cm），默认斜对着沙发和窗户，一转就能看窗外。80 长凳放在茶几靠餐厅那头、对着茶几中间，比茶几宽 27cm，两头各伸出十几厘米，能坐两个人；右边到墙的过道从约 68cm 变成约 60cm，夹角里的边几离长凳只剩几厘米。窗边圆柱和玻璃小花瓶还在窗边。": "Swivel chair and stool swapped: the Casa swivel chair moves to the window end of the coffee table by the right wall (about 2.5 cm off the wall, about 3 cm past the table end), turned toward the sofa and the window so it can swing round to the view. The 80 bench sits at the dining end of the coffee table, centred on it — 27 cm wider than the table, a dozen centimetres past each side, seats two; the aisle to the right wall goes from about 68 cm to about 60 cm, and the side table in the corner is only a few centimetres from the bench. The window pedestal and the glass bud vase stay by the window.", "80 长款竖着靠右墙放（离墙约 1.5cm），比小方凳往窗边挪了约 24cm，整条都在茶几靠窗那头外面，坐下伸腿不碰茶几。": "The 80 bench stands lengthwise against the right wall (about 1.5 cm off it), about 24 cm nearer the window than the stool, wholly past the window end of the table, so legs stretched out from it clear the table.", "80 长款在窗边要往右挪 9cm，和圆几只隔约 2cm；右边窗角要是也放落地灯就放不下了。": "By the window the 80 bench has to move 9 cm right, leaving only about 2 cm to the drum; with a floor lamp in the right-hand window corner as well it won't fit.", "放下": "Down", "主卧阳台和客厅阳台外沿各装一道 Zipblind（全遮光款，没有半遮光的），顶上是收卷盒。放下以后阳台封起来，挡雨、挡晒，阳台能当半个房间用：客厅阳台喝茶看书，主卧阳台放按摩椅或者运动，像多了两个小房间。": "A Zipblind on the outer edge of both the master and the living balcony (full blackout — there's no semi-blackout version), with the roller cassette at the top. Let down, the balconies close up against rain and sun and work like half a room each: tea and reading on the living balcony, the massage chair or exercise on the master balcony — like two more small rooms.", "现在显示：放下。全遮光，放下后外面的树就看不到了，白天阳台里也会比较暗。": "Shown now: down. Full blackout, so the trees outside disappear and the balconies are fairly dark even by day.", "0.9m 定制地台床：床架各 95×205，正好放宜家 90×200 的床垫；两床之间约 54cm，不放床头柜；地台床只有 22cm 高，孩子从床尾、床边上下都方便；床尾到衣柜还有约 89cm。": "0.9 m custom platform beds: frames 95×205 each, made to take IKEA 90×200 mattresses; about 54 cm between the beds, no bedside tables; the platforms are only 22 cm high, easy for the kids to get in and out at the foot or the side; about 89 cm from the bed ends to the wardrobe.", "Banxia 仿蚕丝花瓣吊灯 Φ60（奶油色仿蚕丝 + 铁艺，护眼暖光 60W，¥584.8；吊线 120cm 可调）：几片大花瓣叠成一朵压扁的半开花，挂在餐桌正上方，灯底离桌面约 73cm。餐桌是 140×85 的椭圆，Φ60 大约是桌宽的 2/3，比例最舒服，从客厅看过去也不挡视线。": "Banxia silk-look petal pendant Φ60 (cream silk-look fabric on iron, warm eye-care light 60W, ¥584.8; cord 120 cm, adjustable): big petals layered into a flattened half-open flower, right over the dining table, the bottom about 73 cm above the top. The table is a 140×85 oval and Φ60 is about two thirds of its width — the most comfortable proportion, and it doesn't block the view from the living room.", "C 淘宝侘寂风黑色松木整板自然边茶几（100×50×35，¥437，10 月 20 日晚 8 点双十一 ¥425；也有 120×55 的 ¥687）：一整块松木板，两条长边留着原木的波浪边，两块厚板腿，做旧拉丝黑。黑色和原来选的黑茶几一样，跟黑色餐椅框、藤编椅、浅色地毯、米白沙发、原木餐边柜都搭，比 Aminohome 更有自然感。比 Aminohome 短 13.5cm、矮 4cm，没有下层搁板放遥控器和书；松木偏软，磕到会露浅色印子；四个角是直角，宝宝跑来跑去最好贴防撞角。": "C Taobao wabi-sabi black pine live-edge coffee table (100×50×35, ¥437; ¥425 in the 11.11 sale from 8 pm on 20 Oct; also 120×55 at ¥687): one solid pine slab with both long edges left wavy, two thick slab legs, distressed wire-brushed black. The same black as the table you chose before, so it goes with the black dining-chair frames, the rattan chairs, the light rug, the cream sofa and the oak sideboard — more natural-feeling than the Aminohome. 13.5 cm shorter and 4 cm lower than the Aminohome, with no lower shelf for remotes and books; pine is soft and knocks show pale; the four corners are square — with the toddler running about, stick on corner guards.", "4 把椅子 + Stokke：长边两边各 2 把，Stokke 放靠厨房那头，靠餐边柜那头空着：桌子那头到柜子约 1m，开柜门、拉抽屉、冲咖啡都宽松，餐厅看起来也更空。一家四口坐 3 把 + Stokke，还多 1 把给客人；人多时把客厅的小方凳搬过来。": "4 chairs + Stokke: two on each long side, the Stokke at the kitchen end, the sideboard end left free: about 1 m from the table's end to the cabinet, so doors, drawers and pour-over coffee have room, and the dining room looks emptier. The four of you use 3 chairs + the Stokke, leaving 1 for a guest; with more people, bring over the living-room stool.", "亚克力透明边几（宽 40）：两边空位各只有约 35cm，只能放窗边一个；床往衣柜那边挪约 8cm，衣柜那边留约 27cm，放不下柜子。中间一层放一个带盖的小藤编收纳盒（约 20×18×11），充电线、耳机、护手霜这些小东西收进去，看着不乱；充电线用白色或透明的，插线板放在柜子后面地上。手机放在台面靠床那边充电，线从后面垂下去。台面高 50，比床垫面只低几厘米，晚上摸手机顺手。": "Clear acrylic table (40 wide): each side has only about 35 cm, so just one, by the window; the bed moves about 8 cm toward the wardrobe, leaving about 27 cm on that side — no cabinet fits there. A small lidded woven-rattan box (about 20×18×11) sits on the middle shelf for the chargers, earphones, hand cream and such, so it doesn't look messy; use a white or clear charging cable, with the power strip on the floor behind the table. The phone charges on the bed side of the top, its cable dropping down the back. The top is 50 high, only a few centimetres below the mattress — easy to reach the phone at night.", "床头不放台灯，先用自己的鸡蛋形小夜灯（磨砂白，约 8×11cm），放在台面靠墙那头，晚上一点暖光。": "No bedside lamp: your own egg-shaped night light for now (frosted white, about 8×11 cm) at the wall end of the top, a little warm glow at night.", "胡桃木色 50mm 木百叶，装在书房和孩子房的窗。主卧阳台门不装：阳台外沿有全遮光 Zipblind，要遮光、挡视线时放下来就行，平时门口通透。": "Walnut-colour 50 mm wooden blinds on the study and kids' room windows. None on the master balcony door: the full-blackout Zipblind on the balcony edge comes down for shade or privacy; otherwise the doorway stays open and light.", "胡桃木色 50mm 木百叶：书房、孩子房的窗，加上主卧阳台门三扇各一幅。": "Walnut-colour 50 mm wooden blinds: the study and kids' room windows, plus one on each of the three master balcony door leaves.", "宜家 BRIMNES 坐卧两用床（白色，长 205、宽 87、高 58，两头是矮挡板、没有靠背；两张 80×200 床垫，平时叠在一起当单人床，拉开后并排，床面宽 168；2 个大抽屉，里面 85×54×16）：靠右墙放、一头贴窗，58 高的挡板不太挡窗。不拉开就能直接午睡；床边到书桌约 84cm，椅子照常用（坐着时椅背离床边只剩十几厘米）。抽屉拉满只要约 54cm：椅子在原位时只能拉开约 10–27cm，把椅子推到床尾就能拉满。": "IKEA BRIMNES day-bed (white, 205 long, 87 wide, 58 high, low end panels and no back; two 80×200 mattresses, stacked as a single day to day and side by side when pulled out, 168 wide; two big drawers, 85×54×16 inside): against the right wall, one end at the window — the 58 cm end panel hardly blocks the window. Nap on it straight away without pulling anything out; about 84 cm from the bed edge to the desk, so the chairs work as usual (seated, the chair back is only a dozen-odd cm from the bed). The drawers need only about 54 cm to open fully: with the chairs where they are they open about 10–27 cm; roll the chairs to the foot of the bed and they open all the way.", "现在显示：拉开成双人（床面宽 168）。床边离书桌只剩约 3cm（很近，但碰不到），两把椅子得先搬走；从床尾上下床，床尾到衣柜约 89cm。拉开时床架挡在抽屉前面，抽屉打不开。": "Shown now: pulled out to a double (168 wide). The bed edge comes to only about 3 cm from the desk (close, but clear), so both chairs have to go first; get in and out at the foot, about 89 cm from the wardrobe. Pulled out, the base stands in front of the drawers, so they can't be opened.", "现在：玄关顶天柜、书房窗台柜和书房搁板都是墙色的暖白，跟墙融在一起，存在感最低。": "As now: the entrance cabinet, the study window seat and the study shelves are the warm white of the walls — they melt into the walls.", "米色：跟开发商厨房柜门同一个香槟米色。玄关柜、书房窗台柜和搁板换成米色，跟厨房、原装鞋柜是一套，看起来像跟房子一起做的；比白色温暖，轻法式的感觉更明显。（只是这里先模拟，定了再告诉定制页面。）": "Beige: the same champagne beige as the developer's kitchen doors. With the entrance cabinet, the study window seat and the shelves in beige, they read as one set with the kitchen and the original shoe cabinet — as if built with the flat; warmer than white, more light-French. (Simulated here first; the Carpentry page follows once decided.)", "暖灰：跟开发商原装衣柜同一类暖灰。更沉稳、耐脏，跟黑色餐椅、深色台面更配；但在米色地砖、白墙中间会比米色重一点。（只是这里先模拟，定了再告诉定制页面。）": "Warm grey: the same kind of warm grey as the developer's built-in wardrobes. Calmer and more forgiving of marks, closer to the black chairs and the dark worktop; but against the ivory floor and white walls it is a little heavier than beige. (Simulated here first; the Carpentry page follows once decided.)", "整扇门": "Full door", "靠餐厅那一格也是整扇门，全部封闭。": "The dining-end bay has full doors too, all closed.", "稍微加深": "A little deeper", "圆角柜，稍微加深：长方形 130 × 深 85（标准是 75），前角照样用厂家的圆弧件，一共 6 扇门。柜门正面到对面墙约 1.47m（标准是 1.57m），过道还是宽松的；每格多 10cm 深，中间那格错开放得下 3 个高尔夫球包。": "Rounded corners, a little deeper: 130 × 85 deep (standard 75), the factory's arc pieces on the front corners as before, 6 doors. About 1.47 m from the doors to the opposite wall (1.57 m standard) — the passage stays comfortable; each bay gains 10 cm, and the middle bay takes three golf bags staggered.", "进门那格上下放两个 28 寸行李箱。": "The entrance-end bay takes two 28-inch suitcases, one above the other.", "沙发靠右": "Sofa on the right", "沙发靠左（原来的摆法）": "Sofa on the left (the original)", "沙发靠左（原来的摆法）：站在餐厅往阳台看，沙发在左边那面墙，按阳台推拉门开在左边来留去阳台的路。": "Sofa on the left (the original): looking from the dining room toward the balcony, the sofa is on the left-hand wall, with the way to the balcony kept for a sliding panel on the left.", "4 块隔板": "4 boards", "玄关柜": "Entrance cabinet", "沙发靠右：站在餐厅往阳台看，沙发在右边那面墙。整个客厅左右镜像——沙发、茶几、转椅、电视位、落地灯、窗边茶凳和花几都对调，去阳台的路换到另一边。墙、窗户、天花上的灯不动（轨道射灯会重新对准茶几和转椅）。原来的摆法是按推拉门开在左边留路的，这样就是按开在右边留路；小方凳往客厅里挪了约 46cm，凳子背后跟那面墙的墙头齐，客厅和餐厅之间有了边界，夹角里的边几跟着挪。下面各项说明里写的“左 / 右”，镜像后要反过来看。": "Sofa on the right: looking from the dining room toward the balcony, the sofa is on the right-hand wall. The whole living room is mirrored left-right — sofa, coffee table, swivel chair, TV spot, floor lamp, window stool and pedestal all swap sides, and the way to the balcony moves to the other side. Walls, windows and ceiling lights stay (the track spots re-aim at the coffee table and the chair). The original layout kept the way out for a sliding panel on the left; this one keeps it for a panel on the right; The stool moves about 46 cm into the room, its back level with the end of the wall, so the living room has an edge against the dining room; the corner piece follows. Where the notes below say left / right, read them the other way round.", "靠餐厅那一格开放：正面、柜角的圆弧件和垂直于墙、朝餐厅的那块侧板都只做到台面高度（跟着餐边柜；不放餐边柜就做 85cm），下面是柜门放零食、杯子；台面以上不装门，从餐厅看进去深 35，跟餐边柜一样深，宽就是柜深（标准 75，加深 85）。其余几格照样储物。（只在这里先模拟，定了再告诉定制页面。）": "The dining-end bay opens up: its front, the rounded corner piece and the end panel square to the wall (facing the dining room) stop at the ledge (level with the sideboard's top; 85 cm with no sideboard), doors below for snacks and cups; above, no doors — 35 deep seen from the dining room, the depth of a sideboard, and as wide as the cabinet is deep (75 standard, 85 deeper). The other bays keep their storage. (Simulated here first; the Carpentry page follows once decided.)", "打开柜门看：跟定制页面的内部一样——靠餐厅那格是清洁格（吸尘器和充电座、拖把桶、熨衣板、清洁剂），中间那格放高尔夫球包和一箱补充装，上面两层放瓶瓶罐罐。": "Doors open: the same inside as on the Carpentry page — the dining-end bay is the cleaning bay (vacuum on its dock, mop bucket, ironing board, detergents), the middle bay holds golf bags and a bin of refills with bottles on two shelves above.", "中间那格放 2 个高尔夫球包。": "The middle bay takes two golf bags.", "2m 以上中间那格平放 2 个 28 寸大箱子。": "Above 2 m the middle bay takes two 28-inch cases lying flat.", "2m 以上中间那格平放 2 个 26 寸大箱子（28 寸长 76，标准深度放不进，要加深）。": "Above 2 m the middle bay takes two 26-inch cases lying flat (a 28-inch is 76 long — it needs the deeper cabinet).", "2m 以上中间那格平放 2 个 24 寸箱子（再大的放不进）。": "Above 2 m the middle bay takes two 24-inch cases lying flat (nothing bigger fits).", "进门那格下面站着放 2 个 28 寸大箱子。": "Two 28-inch cases stand in the entrance-end bay.", "2m 以上再平放 1 个 20 寸小箱子；你家另外 2 个大箱子、1 个小箱子放衣柜。": "One 20-inch case lies flat above 2 m as well; the other two large cases and one small go in the wardrobe.", "20 寸小箱子这款柜子里没地方，跟另外 2 个大箱子、1 个小箱子一起放衣柜。": "No room for the 20-inch case in this cabinet — it goes in the wardrobe with the other two large and one small.", "中间那格错开放得下 3 个高尔夫球包。": "The middle bay takes three golf bags staggered.", "走廊": "Corridor", "柜里的分层降到 1.94m，上面不放纸巾夹层，箱子竖着放：两扇门那格并排站 3 个 28 寸，进门那格再站 1 个——4 个大箱子都放进玄关柜，2 个小箱子放衣柜。": "The fixed shelf drops to 1.94 m and the paper layer goes, so the cases stand upright: three 28-inch side by side in the two-door bay and one more in the entrance-end bay — all four large cases in the entrance cabinet, the two small ones in the wardrobe.", "柜里的分层降到 1.94m，上面不放纸巾夹层，箱子竖着放：两扇门那格并排站 2 个 28 寸，进门那格再站 1 个——3 个大箱子放玄关柜，另外 1 个大的和 2 个小的放衣柜。": "The fixed shelf drops to 1.94 m and the paper layer goes, so the cases stand upright: two 28-inch side by side in the two-door bay and one in the entrance-end bay — three large cases here, the fourth and the two small ones in the wardrobe.", "进门那格下面站着放 2 个 28 寸；分层降到 1.94m、上面不放纸巾夹层，两扇门那格再竖放 2 个——一共 4 个大箱子，2 个小箱子放衣柜。": "Two 28-inch cases stand in the entrance-end bay; with the fixed shelf at 1.94 m and no paper layer, two more stand upright in the two-door bay — four large cases in all, the two small ones in the wardrobe.", "加宽到墙边：柜子往餐厅那头加长 25.5cm，端面跟旁边那面墙的墙面齐平（总长约 155）。开放格还是 35 深，后面三扇门各宽约 38：靠开放格的两扇门里面是一整格（不加竖隔板），进门那扇单独一格。": "Widened to the wall's edge: the cabinet grows 25.5 cm toward the dining room, its end flush with the wall beside it (about 155 long). The open bay stays 35 deep; behind it three doors about 38 wide: the two next to the open bay share one bay (no partition), the entrance-end door has its own.", "加长：柜子往餐厅再伸出 40cm（沿墙总长约 196），开放格从柜子的圆角一直做到客卫那面墙——长约 114（加深约 124）、深 35，正好一个餐边柜的大小；台面以下三扇门朝餐厅，台面以上开放，背后贴墙。后面储物三扇门，各宽约 52：靠开放格的两扇门里面是一整格（不加竖隔板，里面宽约 102），进门那扇单独一格。": "Longer: the cabinet comes 40 cm further into the dining room (about 196 along the wall), and the open bay runs from its rounded corner all the way to the common bathroom's wall — about 114 long (124 deeper) and 35 deep, exactly a sideboard; three doors facing the dining room below the ledge, open above, its back on the wall. The storage behind has three doors about 52 wide: the two next to the open bay share one bay (no partition, about 102 wide inside), the entrance-end door has its own.", "墙": "Walls", "实心": "Solid", "圆角柜，做浅一点：深 60（标准是 75），前角照样用厂家的圆弧件。柜门正面到对面墙约 1.72m（标准 1.57m），柜子跟餐桌之间的过道也宽 15cm；28 寸箱子深 52，竖着照样放得下，高尔夫球包也放得下，只是每格浅 15cm，靠里能塞的东西少一点；开放格从餐厅看过去也短 15cm。": "Rounded corners, slimmer: 60 deep (standard 75), the factory's arc pieces on the front corners as before. About 1.72 m from the doors to the opposite wall (1.57 m standard), and the passage between cabinet and dining table gains 15 cm; a 28-inch case is 52 deep, so it still stands upright inside, golf bags fit too — each bay is just 15 cm shallower, and the open bay is 15 cm shorter seen from the dining room.", "原位": "Where it was", "靠玄关柜那边最窄的地方（柜子正面到最近那把椅子）约": "At its narrowest the passage past the entrance cabinet (cabinet front to the nearest chair) is about", "cm；餐桌另一头（宝宝椅）到厨房台面约": "cm; from the other end of the table (the Stokke) to the kitchen counter about", "吊灯跟着餐桌一起挪，灯线位置要跟灯光页面说。": "The pendant moves with the table — its ceiling point needs telling to the lighting page.", "一个人侧身过要 45cm 左右，正常走过去最好有 60–70cm。": "About 45 cm lets one person sidle through; 60–70 cm is comfortable walking.", "去掉柜门": "Doors off", "直角": "Square", "朝走廊那面（柜子正面和转角）在台面以上也封起来，开放格只朝餐厅开；从走廊看过去就是一整面柜子，看不到里面放的东西。": "The corridor side (the cabinet front and the corner) is closed above the ledge too, so the open bay faces the dining room only; from the corridor it reads as one run of cabinet, nothing on show.", "朝走廊那面也开着，从走廊和餐厅都看得到开放格里的东西。": "The corridor side is open too — the open bay's things show from the corridor and the dining room.", "直角：柜子看起来是方角，利落；但跟木工说角不要锋利——柜角和开放格台面的边都倒一个小圆角（大约 R10–R20，或者只带一点点圆弧），摸上去不割手，台面那个角离地 85cm、在过道边，宝宝磕到也不疼。不用厂家的圆弧件，比圆角柜省一点。": "Square: the cabinet reads as square-cornered and crisp; but ask the wall (the earlier length), the sideboard in its end bay", "餐边柜做在玄关柜靠餐厅那头的一格：宽就是柜子的深度，台面 85 高，下面一扇小门，上面开放格放杯子、酒、茶具，加护栏（淘宝）和灯带；柜子停在厕所墙前面": "The sideboard is the entrance cabinet's bay at the dining end: as wide as the cabinet is deep, a counter at 85, a small door below, open shelves above for glasses, wine and the tea set, with rails (Taobao) and an LED strip; the cabinet stops short of the toilet wall", "床边壁挂": "Bedside shelf", "松绿": "Pine green", "床头另一边（靠衣柜那边）放一个纸质转角壁挂，和玄关那个一样大（Φ45×高20 的转角款，90° 四分之一圆，半径 22.5）：塞进衣柜侧板和床头墙的直角里，沿两面各占 22.5cm，床边到衣柜 27.4cm，离床还有约 4cm；台面离地约 62cm，放一杯咖啡。": "On the other side of the bed head (toward the wardrobe), a honeycomb-paper corner shelf the same size as the hall's (the corner piece of the Ø45 × 20 high, a 90° quarter round, radius 22.5): tucked into the right angle of the wardrobe's side panel and the headboard wall, 22.5 cm along each; bed to wardrobe is 27.4 cm, so about 4 cm stays clear; the top about 62 cm up, for a coffee.", "到厕所墙": "To the toilet wall", "凳子贴书房墙": "Stool against the study wall", "收起选项": "Hide options", "展开选项": "Show options", "台面以上 4 块隔板：第一格留高 55cm（水壶、香蕉架、吃饭时挪过来的兰花都放得下），上面每格约 34cm，跟书架差不多；最上面一块离地约 2.43m，手够不着，放不常动的东西——图里放了一幅你以后自己画的小画和一个透明玻璃花瓶。": "Four boards above the ledge: the first gap 55 cm tall (jug, banana stand and the orchid moved over during meals all fit), the rest about 34 cm, like a bookcase; the top board is about 2.43 m up, out of reach — for things that seldom move: the picture shows one of your future paintings and a clear glass vase.", "台面以上 5 块隔板：第一格一样 55cm，上面每格约 28cm，碗一层一摞正好；最上面一块离地约 2.5m，一样放画和玻璃花瓶这类不常动的。": "Five boards above the ledge: the first gap again 55 cm, the rest about 28 cm — one stack of bowls per board; the top board about 2.5 m up, again for a painting or a glass vase.", "黑色平衡臂环形灯（卖家标 D140×H170，D140 是底座直径 14cm；黑色水磨石圆柱底座 Φ14、高 28，黑色细杆高 1.5m，横臂约 70cm、斜着往上翘，一头配重；灯头是一圈 Φ18 的黑色细环，里面半个小碗，外黑内铜色，光往下往前打；总高 1.7m，LED 7W，¥367.8）：灯头朝窗户中间探出去约 50cm，把视线往上拉。": "Black balance-arm ring lamp (listed D140 × H170 — D140 is the 14 cm base: a black terrazzo column base Ø14, 28 high, a slim black rod 1.5 m tall, an arm of about 70 cm tilted up with a counterweight at one end; the head a thin black Ø18 ring with a shallow dish inside, black outside and copper inside, lighting down and forward; 1.7 m overall, LED 7W, ¥367.8): the head reaches about 50 cm toward the middle of the window and draws the eye upward.", "窗边": "By the window", "三角树瘤": "Triangle burl", "沙发靠右时，凳子贴书房墙放：背靠墙（离墙约 1cm），焦糖色靠枕贴着墙当靠背，面朝沙发尾。凳子角离茶几角约 40cm：再往茶几挪，这里就只剩二十几厘米，墙边那条去转椅和窗边的路就进不去了。": "With the sofa on the right, the stool stands against the study wall: back to the wall (about 1 cm off), the caramel bolster against the wall as a backrest, facing the sofa's end. Its corner is about 40 cm from the table's corner: any closer and that gap drops to twenty-odd cm, and the way along the wall to the swivel chair and the window can no longer be entered.", "茶几往书房墙挪了 15cm：沙发座位边到茶几最近处从约 24cm 变成约 39cm，坐沙发腿放得下了；代价是墙边那条路从约 67cm 变成约 52cm（一个人走刚好），转椅到茶几角从约 28cm 变成约 24cm。": "The coffee table 15 cm toward the study wall: the sofa's seat edge to the table goes from about 24 cm at the closest to about 39 cm, so legs fit on the sofa; the cost is the way along the wall, from about 67 cm to about 52 cm (just right for one person), and the swivel chair to the table's corner, from about 28 cm to about 24 cm.", "沙发后角落": "Corner behind the sofa", "空着": "Empty", "沙发后面、窗玻璃和右墙之间的三角空位放三角树瘤边几（正面 38、两边 35、高 60）：尖角朝墙角，平的一面离沙发背约 5cm。这块空位从墙角斜着到沙发弧背约 62cm；沿玻璃约 80cm 后沙发头离玻璃只剩 29cm；沿墙越往里越窄，约 1.7m 处沙发靠上墙。平时没人走到这里，放这里不占任何路；高 60 比沙发靠背矮，从房间里看只露出一点树瘤的黄。": "In the dead corner behind the sofa, between the glass and the side wall, the triangular burl side table (38 front, 35 sides, 60 high): point into the corner, flat face about 5 cm off the sofa's back. The corner is about 62 cm deep on the diagonal to the sofa's curved back; along the glass, after about 80 cm the sofa's nose is only 29 cm off the glass; along the wall it narrows until the sofa meets the wall about 1.7 m in. Nobody walks there, so it takes no floor from any path; at 60 it stays below the sofa's back, so from the room only a little of the burl's yellow shows.", "法式铁艺 X 凳（长 50.9、宽 41.9、坐高 43）：黑色弯铁腿交叉，四角小圆球，米白条纹圈绒坐垫；腿细、底下是空的，线条最轻最透，客厅看着最不挤。": "French iron curule stool (50.9 long, 41.9 wide, seat 43): crossed curved black iron legs, small balls at the corners, a striped cream boucle pad; thin legs and open underneath, the lightest and most see-through, so the room looks least crowded.", "凳子": "Stool", "法式铁艺X凳": "French iron X stool", "顺着墙": "Along the wall", "横着放": "Across", "沙发后面、窗玻璃和右墙之间的墙角放方形树瘤高几（30×30、高 80，¥550）：方方正正塞进墙角（离墙 1cm、离玻璃 3cm），离沙发弧背最近约 10cm。高 80 和沙发靠枕顶差不多齐（靠枕顶约 84cm，靠背框 68cm），从房间里看像是沙发背后接出来的一截，不突兀。": "In the corner behind the sofa, between the glass and the side wall, the square burl block (30×30, 80 high, ¥550): square into the corner (1 cm off the wall, 3 cm off the glass), about 10 cm from the sofa's curved back at the closest. At 80 it is about level with the sofa's back cushions (about 84; the back frame is 68), so from the room it reads as a piece continuing the sofa's back rather than standing out.", "卡萨驰转椅 Φ77 现在在窗边这头：背靠墙、斜对沙发和窗户，坐下转个身就是窗外的树；转椅左前方靠窗放一个黑色小铁圆几，边几挪去餐厅那头了。": "The Casa swivel chair Φ77 is at the window end now: back to the wall, turned toward the sofa and the window — sit down and swing round to the trees outside; a small black iron round table stands at its front left by the glass, the side table has moved to the dining end.", "转椅边": "By the swivel chair", "小铁圆几": "Small iron round table", "横着放：凳子一头顶着书房墙（离墙 1cm），长边朝餐厅和窗户，法式凳的 X 腿、扶手凳的圈形扶手从餐厅和窗边看过去正好是正面；整张凳子都在墙头以内；靠窗那边离茶几尾端约 30cm，坐着伸手就够到茶几。代价是墙边那条路从这头进不去了，要去转椅得从茶几和沙发中间（约 39cm）侧身过。": "Across: one end against the study wall (1 cm off), the long side toward the dining room and the window, so the curule's X and the arm stool's loops face the way in; the whole stool stays within the wall's length, about 30 cm from the coffee table's end - within reach of it when seated. The cost: the way along the wall can't be entered from this end; to reach the swivel chair you pass sideways between the coffee table and the sofa (about 39 cm).", "¥23 黑色铁艺小圆几（台面 Φ20、高 58、圆底座 Φ20）塞进书房墙和窗玻璃的墙角，在转椅左后方：离墙约 1.5cm、离玻璃约 3cm，离转椅约 6cm；转椅一转就够得着，完全不占去窗边的路（转椅到沙发之间留出约 72cm）。这里不放花瓶（小孩够得着），兰花放在沙发后面那根柱子上。": "The ¥23 black iron round side table (top Φ20, 58 high, round base Φ20) tucked into the corner of the study wall and the glass, behind the swivel chair's left: about 1.5 cm off the wall, 3 cm off the glass and 6 cm from the chair; a turn of the chair brings it within reach, and it takes nothing from the way to the window (about 72 cm stays open between the chair and the sofa). No vase here (within the children's reach) - the orchid goes on the column behind the sofa.", "沙发后面的墙角放黑色碳化木方柱（18.5×18.5、高 80，¥198.8，带一点自然裂纹）：方方正正塞进墙角（离墙 1cm、离玻璃 3cm），比 30 的细很多，离沙发弧背更远；高 80 和沙发靠枕顶差不多齐；黑色和茶几的黑格栅是一套，上面放兰花。": "In the corner behind the sofa, a carbonized black wood column (18.5×18.5, 80 high, ¥198.8, with a few natural checks): square into the corner (1 cm off the wall, 3 cm off the glass), much slimmer than the 30 one and further from the sofa's curved back; at 80 about level with the sofa's back cushions; the black goes with the coffee table's grid, and the orchid stands on it.", "凳子靠沙发、墙边走人": "Stool by the sofa, way along the wall", "门口那格": "Bay by the door", "抽拉鞋架": "Pull-out shoe rack", "清洁工具": "Cleaning kit", "中间两半格的上半部各装两层定制抽拉篮（篮宽按半格内宽，两边各留 1.27cm 装阻尼滑轨）；餐边柜下柜也改成两层抽拉篮放零食，往餐厅方向拉；顶上一格放行李箱，保留固定层板": "The upper part of each half of the middle bay gets two made-to-measure pull-out baskets (as wide as the half allows, 1.27 cm each side for soft-close runners); the sideboard's low cupboard gets two pull-out baskets for snacks, sliding out toward the dining room; the top compartment keeps its fixed board for the suitcases", "抽拉篮": "Pull-out baskets", "层板": "Boards", "卡门凳": "Carmen stool", "卡门凳（藤编扶手矮凳）黑色+米白坐垫：长 60、宽 34、坐高 38、扶手高 47，¥500；两头弯成圈的扶手，黑框和茶几的黑格栅是一套；坐高 38 比沙发低一点、偏放松；连扶手全长约 63cm，贴墙放时会比墙头多伸出约 14cm。": "The Carmen stool (rattan, loop arms) in black with a cream pad: 60 long, 34 wide, seat 38, arms 47, ¥500; loop arms at both ends, the black frame one family with the coffee table's grid; at 38 the seat sits a little below the sofa, relaxed; about 63 cm overall with the arms, so against the wall it reaches about 14 cm past the wall's end.", "凳子横着放在茶几靠餐厅那一头外面，正对茶几、离茶几约 30cm，靠沙发那头离沙发弧边约 3cm；书房墙边留出一条笔直的路一直走到转椅（法式凳旁约 56cm，卡门凳旁约 48cm）。法式凳的 X 腿正对餐厅；缺点是背后没有墙可以靠。": "The stool across at the coffee table's dining end, facing it about 30 cm off, its sofa end about 3 cm from the sofa's curve; a straight way runs along the study wall to the swivel chair (about 56 cm beside the curule, 48 beside the Carmen stool). The curule's X faces the dining room; the catch is no wall to lean back on.", "原来的茶凳": "The old stool", "左右平移": "Pan left / right", "向左平移（也可以右键拖动、Shift+拖动、方向键；手机两指拖动）": "Pan left (or right-drag, shift-drag, the arrow keys; two fingers on a phone)", "向右平移（也可以右键拖动、Shift+拖动、方向键；手机两指拖动）": "Pan right (or right-drag, shift-drag, the arrow keys; two fingers on a phone)", "上下左右平移": "Pan up / down / left / right", "向上平移（也可以右键拖动、Shift+拖动、方向键；手机两指拖动）": "Pan up (or right-drag, shift-drag, the arrow keys; two fingers on a phone)", "向下平移（也可以右键拖动、Shift+拖动、方向键；手机两指拖动）": "Pan down (or right-drag, shift-drag, the arrow keys; two fingers on a phone)", "纸质半岛壁挂一个 Φ45×高20，粉色，台面离地 1.5 m（可折叠，¥98.8）": "One paper half-round wall shelf D45 x H20, pink, top 1.5 m off the floor (folds flat, ¥98.8)", "粉色": "Pink", "棕色": "Brown", "网篮支架 124×42：放正、背贴床尾那面墙，对着床中间；床尾到墙约 45cm，支架前沿离床尾只剩约 2.5cm，屏幕中心离枕头约 2.1m，": "Mesh stand 124 × 42: square to the foot wall with its back on it, facing the middle of the bed; the foot aisle is about 45 cm, so the stand's front is only about 2.5 cm from the bed; screen centre about 2.1 m from the pillows, ", "银翼 V 脚支架（金属）+ LG OLED：放在床尾靠窗的角落，屏幕朝房间里、斜对着床头中间，离枕头约 2m；屏幕离窗玻璃约 15cm、离床尾那面墙约 12cm。支架自带的洞洞板挂在电视后面，soundbar 用两个挂钩挂在洞洞板上，贴着屏幕下沿。长的那条腿伸进床底约 2cm（床底离地约 12cm、腿只有 3.5cm 高，不会碰），短的那条停在床和窗之间，不碰床脚。床尾过道空出来了；要挪就推（带轮子）。适配 40–70 寸，承重 30kg。": "Silver V-leg stand (metal) with the LG OLED: in the bed-foot corner by the window, the screen turned into the room toward the middle of the bed head, about 2 m from the pillows; the screen about 15 cm off the window glass and 12 cm off the foot wall. The stand's own pegboard hangs behind the TV and the soundbar hangs on it on two hooks, just under the screen's bottom edge. The long leg slides about 2 cm under the bed (the bed stands about 12 cm off the floor, the legs are only 3.5 cm high, nothing touches); the short one ends between the bed and the window, clear of the bed's leg. The foot aisle is free; push it to move it (castors). Fits 40–70\", carries 30 kg.", "源氏木语实木床（北美黑胡桃木、木蜡油，低铺斜靠款 K33B10）：1.8m 款总宽 191.5、总深 214.5、床头高 92，床头板往后斜靠，四角方腿，床底离地约 12cm。比原来的模型长 15cm：床尾到墙的过道从约 61cm 变成约 45cm；电视用银翼 V 脚支架，放在床尾靠窗的角落，斜对着床头中间。": "Yuanshi solid-wood bed (North American black walnut, wax oil, low bed with leaning headboard K33B10): the 1.8 m size is 191.5 wide, 214.5 deep, headboard 92 high leaning back, square corner legs, about 12 cm clear underneath. It is 15 cm longer than the old model: the aisle at the foot shrinks from about 61 cm to about 45 cm; the TV is on the silver V-leg stand in the bed-foot corner by the window, turned toward the middle of the bed head.", "台面以上 4 块隔板（从下往上）：台面这一格 60cm，放香蕉架、果盘、水壶；第一块板离地约 1.47m，上面 32cm 放茶壶和小茶杯，半高加一块玻璃层板放马克杯；第二块约 1.81m，上面 30cm 放红酒杯和醒酒器；第三块约 2.12m，上面 36cm 放酒瓶；第四块约 2.50m，最上面一格放篮子装杂物（要踩凳子）。灯：背板上靠两头各一条竖装暖光软灯带，从台面通到顶，嵌在铝槽里看不到灯珠（隔板在灯带经过的地方开缺口），晚上从背后照亮杯子和酒瓶，也当餐厅角落的小夜灯；驱动放在柜子里，木工做柜时留插座。": "Four boards above the counter (bottom up): the counter layer 60 cm - banana stand, fruit bowl, jug; the first board about 1.47 m, 32 cm above it for teapots and small cups, with a glass shelf halfway up for the mugs; the second about 1.81 m, 30 cm for wine glasses and the decanter; the third about 2.12 m, 36 cm for bottles; the fourth about 2.50 m, baskets for odds and ends in the top layer (a step stool). Light: two vertical warm soft LED strips on the back panel, one near each end, counter to top, set in aluminium channels so no dots show (the boards are notched where they pass); at night they backlight the glasses and bottles and double as a night light for the dining corner; the driver goes inside the cabinet - the carpenter leaves a socket.", "门口那格一扇约 40 宽的整门（铰链在靠中间格那边，用大角度、零侧移的铰链，不挡开口），里面装定制黑色铝合金抽拉鞋架（宽 34.5、深 70、约高 174，12 层，每层前后两双，约 24 双；柜内净高只有约 175，柜子装好量了再下单）；中间两门格加一块竖隔板：一边两个大人球包加一个小孩球包（支架包，直径 26 以内），错开站在地上（侧板洞洞板挂帽子、手套、伞），一边洞洞板挂烫衣板、吸尘器（插座在后面），拖把、扫把、刮水器挂在层板下的抽拉挂钩架上（一拉就出来），拖把桶放地上；其他格子都是可调层板": "The bay by the front door has one door about 40 wide (hinged on the middle-bay side, wide-angle zero-offset hinges so nothing blocks the opening) and a made-to-measure black aluminium pull-out shoe rack (34.5 wide, 70 deep, about 174 high, 12 tiers, two pairs a tier, about 24 pairs; only about 175 clear inside, so measure after the cabinet is in, then order); the middle two-door bay split by a partition - two adult golf bags and a child's (stand bags, D26 at most) standing staggered on the floor on one side (pegboard on its side panel for caps, gloves and an umbrella), pegboard on the other side for the ironing board and the stick vacuum (socket behind), the mop, broom and squeegee on a pull-out hook rail under the board (out in one pull), the mop bucket on the floor; adjustable boards everywhere else", "纸壁挂替代亚克力：窗边挂半圆款（和玄关同一个形状的小号，Φ35×高15，伸出墙 17.5cm），平的一边贴床头墙，在窗玻璃和床头板之间，左右各留约 3.5cm；床照旧往衣柜那边挪 8cm。衣柜那边还是原来的转角款（R22.5），里面放一杯咖啡。台面离地约 62cm，比床垫高约 7cm。窗边那个放手机和鸡蛋小夜灯（或一杯茶）：手机顺着墙放，充电线从后面垂下去。Φ31 那款是碗形，和玄关的不是一套，所以不用；同形状的 Φ35 两边都挂放不下（衣柜那边只有约 27cm）。纸怕水，杯子下面垫个杯垫。": "Paper shelves instead of the acrylic: by the window the half-round (the hall's shape in its smaller size, D35 x H15, 17.5 cm off the wall), flat edge on the headboard wall between the window glass and the headboard, about 3.5 cm spare at each end; the bed stays 8 cm toward the wardrobe. ), between the sofa and the rattan chair with ~4 cm either side; the chair moved toward the study wall by", "cm。细杆、底下是空的，比黑柱轻巧，高度和椅子扶手差不多，放一杯茶、一部手机刚好。": "cm. A thin stem with nothing under it - lighter than the column, about the chair arm's height; right for a cup of tea and a phone.", "组合1·奶牛凳": "Set 1 · cowhide bench", "组合2·转椅（参考图）": "Set 2 · swivel chair (the reference)", "乐园 290": "乐园 290 (Le Yuan)", "黑柱台灯：黑碳化木方柱 18.5×18.5×80（原款的高度）上放一盏经典台灯（黑色车木灯座 + 米白亚麻灯罩，下口 Φ32），灯罩顶离地约 1.29m，从餐厅越过转椅也看得到；灯罩下沿约 1.07m，和坐着的眼睛差不多高，用磨砂灯泡就不刺眼。它要插电：这个角上要留一个插座。": "Column + table lamp: a classic lamp (turned black base, cream linen empire shade D32 at the bottom) on the black carbonized column 18.5 x 18.5 x 80 (the find's own height); the shade's top ~1.29 m, seen over the swivel chair from the dining room; its lower edge ~1.07 m, about seated eye height - a frosted bulb keeps it from glaring. It needs a socket in this corner.", "椅子朝向": "Chair facing", "平行窗·朝沙发（看书）": "Parallel to the window, facing the sofa (reading)", "平行窗·朝书房墙（看电视）": "Parallel to the window, facing the study wall (TV)", "斜45°": "45°", "不放摆件": "Nothing on it", "定制 100×50": "Custom 100×50", "定制 100×45": "Custom 100×45", "黑柱＋兰花": "Black column + orchid", "窗角放黑碳化木方柱 18.5×18.5×60，上面一个玻璃小花瓶插一枝紫色蝴蝶兰，往客厅这边弯；柱子 60 高，小孩伸手够得到，花瓶选厚底的或者亚克力的。这个角不放灯了，晚上看书靠头顶那两盏射灯（一盏照窗边椅子，一盏照转椅）。": "In the window corner the black carbonized column 18.5 x 18.5 x 60 with a clear bud vase and one purple phalaenopsis stem arching toward the room; at 60 high a child can reach it - pick a thick-based or acrylic vase. No lamp in this corner now: for reading at night, the two track spots overhead (one on the window chair, one on the swivel chair).", "摆件：两本书": "On it: two books", "凳子放进门左手边、玄关柜侧面和 DB 柜门之间的角落；开 DB 柜最里面那扇门时把凳子挪开": "The stool in the corner on your left as you come in, between the entrance cabinet's end panel and the DB closet doors; move it to open the DB closet's innermost door", "钥匙台：进门右手那面墙、镜子靠里的一侧，挂一块胡桃木小搁板（26×12，台面离地 1.05m），和 MUJI 镜子的胡桃木框是一套；上面一个黄铜小托盘放钥匙，一个玻璃小花瓶插一枝紫色蝴蝶兰。大门开到底也碰不到它。": "Key ledge: on the wall to your right as you come in, on the inner side of the mirror, a small walnut floating ledge (26 x 12, top 1.05 m up) to go with the MUJI mirror's walnut frame; a small brass tray for the keys and a clear bud vase with one purple phalaenopsis stem. The front door opened all the way doesn't reach it.", "钥匙台": "Key ledge", "胡桃木小搁板": "Small walnut ledge", "鼠尾草绿平织": "Sage flat-weave", "米白黑边": "Ivory, black border", "灰蓝平织": "Blue-grey flat-weave", "走廊地垫": "Hall runner", "平织长条 80×250": "Flat-weave runner 80×250", "地毯只试平织的（可水洗、没有绒毛，不挂头发、不怕潮）：客厅 160×230 压在茶几下面、沙发和椅子前脚压上去约 10cm，靠书房墙留出 20cm 地面，把客厅和餐厅分开；走廊地垫 80×250 从玄关沿着过道铺到餐厅口，避开大门开门的范围。底下加防滑垫。": "Flat-weave rugs only (washable, no pile - they don't hold hair or mind the damp): in the living room 160 x 230 under the coffee table, the sofa's and the chairs' front feet ~10 cm on it, 20 cm of floor left at the study wall - it sets the living room apart from the dining; a runner 80 x 250 from the hall down the passage to the dining room, clear of the front door's swing. A non-slip underlay under both.", "柜侧挂画": "Picture on the cabinet's side", "两幅小画 30×40": "Two small pictures 30×40", "不挂": "None", "开门第一眼：玄关柜朝门的那块侧板上挂一幅竖幅大画（45×100，细黑框，画心离地约 0.95–1.95m），绿色、灰蓝的大叶子，和沙发上的花抱枕、窗外的树是一个颜色；人一进门视线先停在画上，不会直接看穿到餐厅。画框要薄（2.5cm 以内），DB 柜门开到底也碰不到。": "The first look as the door opens: a tall picture (45 x 100, a thin black frame, the picture 0.95-1.95 m up) on the entrance cabinet's end panel facing the door - big leaves in greens and blue-grey, the colours of the sofa's floral pillows and the trees outside; the eye stops on it instead of running straight through to the dining room. Keep the frame thin (under 2.5 cm) so the DB closet's door still opens past it.", "去房间走廊": "Bedroom corridor", "平织长条 80×200": "Flat-weave runner 80×200", "去房间的走廊铺一条平织长条 80×200：从主卧门开门的范围外面开始（主卧门是往走廊开的），一直铺到走廊口，两边各露出约 16cm 地面；颜色跟客厅地毯一样，客厅和走廊连成一套。": "A flat-weave runner 80 x 200 in the corridor to the bedrooms: from outside the master bedroom door's swing (that door opens out into the corridor) to the corridor's mouth, ~16 cm of floor showing each side; the same colour as the living rug, so the two read as a set.", "马蒂斯剪纸风 45×100": "Matisse cut-outs 45×100", "叶子画 45×100": "Leaf botanical 45×100", "开门第一眼：玄关柜朝门的侧板上挂一幅马蒂斯剪纸风的竖幅画（45×100，细黑框）：钴蓝和叶绿的海藻、叶子剪影铺在米白底上，颜色跟沙发上的蓝绿花抱枕、客厅的绿地毯呼应；形状简单、颜色干净，没有自然光的玄关也一眼就亮。画框薄于 2.5cm，DB 柜门开到底也碰不到。": "The first look as the door opens: a tall picture after Matisse's paper cut-outs (45 x 100, a thin black frame) on the entrance cabinet's end panel facing the door - cobalt-blue and leaf-green algae and leaves on cream, the colours of the sofa's floral pillows and the green rug; simple shapes, clean colour, bright even in a hall with no daylight. Keep the frame under 2.5 cm so the DB closet's door still opens past it.", "餐桌往厕所墙挪 45cm：靠玄关柜那边的过道不走人；西头那把椅子坐着时背后到厕所墙约 42cm，侧身坐进去；南边靠走道那把藤编扶手椅背对着餐边格，餐边格下柜改成推拉门（不用往外转，椅子挡不着）；抽屉 30 深、全拉出滑轨，椅子推进桌下能拉出约 25cm，有人坐时先推椅子；靠厨房那头（宝宝椅）到厨房台面约": "The table 45 cm toward the toilet wall: the passage by the entrance cabinet isn't used; seated, ~42 cm behind the west-end chair to the toilet wall - you sit in sideways; the corridor-side rattan armchair has its back to the sideboard bay, whose low doors are now a sliding pair (nothing swings out, the chair can't block them); the drawer is 300 deep on full-extension runners - with the chair pushed in it comes out ~25 cm, push the chair in first if someone sits there; from the kitchen end (the high chair) to the kitchen counter about", "窗角斜放（南洋）": "Window corner, angled (Nanyang)", "斜放角度": "Angle", "椅子和卡门凳平行于窗：人朝沙发坐，窗光从侧面照在书上；椅背离书房墙约 2cm，脚凳和沙发之间留约 71cm（藤编椅约 60cm），从这里去窗边。": "The chair and the Carmen stool parallel to the glass: you sit facing the sofa with the window light from the side on your book; the chair's back ~2 cm off the study wall, ~71 cm (the rattan chair ~60 cm) between the stool and the sofa - the way to the window.", "椅子和卡门凳平行于窗、朝书房墙坐：电视挂在书房墙正对沙发的中间，从这里看要往餐厅 厅线约": "cm off the glass; the Carmen stool in front of it as a footstool. The sofa and the swivel chair both move toward the dining end: the sofa's end ~", "C形边几": "C side table", "烟灰": "Smoke", "茶色": "Tea brown", "水波纹": "Water ripple", "C形亚克力边几（烟灰，12mm 一整张弯成，45×30）放在转椅书房墙那一侧：和黑色骏马椅一个调子，比透明有存在感，刮痕不明显。沙发没脚，底座推不进座位下面；高度按转椅坐高 + 20cm 选。": "A smoke acrylic C side table (one 12 mm sheet, 45×30) on the study side of the swivel tub: one tone with the black 骏马 chair, more present than clear, scratches show less. The sofa has no legs, so the base can't slide under the seat; height = the tub's seat height + 20 cm.", "C形亚克力边几（茶色，45×30）放在转椅书房墙那一侧：暖，但和树瘤茶几的蜂蜜色抢，不推荐。高度按转椅坐高 + 20cm 选。": "A tea-brown acrylic C side table (45×30) on the study side of the swivel tub: warm, but it fights the burl table's honey tone - not recommended. Height = the tub's seat height + 20 cm.", "C形亚克力边几（透明水波纹，45×30）放在转椅书房墙那一侧：刮痕指纹不显，像件小艺术品；但台面起伏，笔记本和杯子放不平、纹路里积灰，这个角已经有竹节花格、树瘤纹和花抱枕，会太花。真喜欢就挑台面平、只有侧面带纹的款。": "A clear water-ripple acrylic C side table (45×30) on the study side of the swivel tub: hides scratches and prints, a small art piece; but the top undulates, so a laptop or a cup doesn't sit flat and dust gathers in the ripples, and with the bamboo lattice, the burl and the floral pillows this corner gets too busy. If you love it, pick one with a flat top and ripples only on the sides.", "组合A·自己摆的": "Set A · your own", "cm，转椅背": "cm, swivel chair's back", "cm（正数是超出客厅线、负数是在线里面）。": "cm (positive: past the living-room line; negative: inside it).", "C形亚克力边几（透明，一整张 12mm 亚克力弯成，45×30，高 45）放在转椅书房墙那一侧，填上沙发和窗边椅子之间的空：转椅转向窗或朝屋里都够得着，放书、杯子、笔记本。沙发没脚，底座推不进座位下面，打字要坐到座位前沿；高 45，和躺椅扶手差不多高，放书、杯子顺手。透明最轻，不显挤。": "A clear acrylic C side table (one 12 mm sheet bent, 45×30, 45 high) on the study side of the swivel tub, filling the gap between the sofa and the window chair: in reach with the tub turned to the window or to the room. The sofa has no legs, so the base can't slide under the seat; 45 high is about the lounge chair's arm h  60이라 소파 등받이보다 낮아 거실에선 버얼의 노란색이 조금만 보임.", "法式铁艺 X 凳（长 50.9、宽 41.9、坐高 43）：黑色弯铁腿交叉，四角小圆球，米白条纹圈绒坐垫；腿细、底下是空的，线条最轻最透，客厅看着最不挤。": "프렌치 철제 X 스툴(길이 50.9, 폭 41.9, 좌고 43): 교차된 검은 곡선 철 다리, 네 모서리 작은 구슬, 크림 줄무늬 부클 쿠션; 다리가 가늘고 아래가 비어 가장 가볍고 투명해 거실이 가장 덜 붐벼 보임.", "凳子": "스툴", "法式铁艺X凳": "프렌치 철제 X", "顺着墙": "벽 따라", "横着放": "가로로", "沙发后面、窗玻璃和右墙之间的墙角放方形树瘤高几（30×30、高 80，¥550）：方方正正塞进墙角（离墙 1cm、离玻璃 3cm），离沙发弧背最近约 10cm。高 80 和沙发靠枕顶差不多齐（靠枕顶约 84cm，靠背框 68cm），从房间里看像是沙发背后接出来的一截，不突兀。": "소파 뒤, 창 유리와 옆 벽 사이 모서리에 사각 버얼 블록(30×30, 높이 80, ¥550): 모서리에 반듯하게(벽에서 1cm, 유리에서 3cm), 소파 곡면과 가장 가까운 곳 약 10cm. 높이 80은 소파 등쿠션 윗면(약 84cm, 등받이 프레임 68cm)과 거의 같아 거실에서 보면 소파 등 뒤로 이어진 한 덩어리처럼 보여 튀지 않음.", "卡萨驰转椅 Φ77 现在在窗边这头：背靠墙、斜对沙发和窗户，坐下转个身就是窗外的树；转椅左前方靠窗放一个黑色小铁圆几，边几挪去餐厅那头了。": "카사 회전의자 Φ77은 이제 창가 쪽: 벽을 등지고 소파와 창을 비스듬히 향함 — 앉아서 돌면 창밖 나무; 의자 왼쪽 앞 창가에 작은 검은 철제 원형 테이블, 사이드 테이블은 식당 쪽으로.", "转椅边": "회전의자 옆", "小铁圆几": "작은 철제 원형 테이블", "横着放：凳子一头顶着书房墙（离墙 1cm），长边朝餐厅和窗户，法式凳的 X 腿、扶手凳的圈形扶手从餐厅和窗边看过去正好是正面；整张凳子都在墙头以内；靠窗那边离茶几尾端约 30cm，坐着伸手就够到茶几。代价是墙边那条路从这头进不去了，要去转椅得从茶几和沙发中间（约 39cm）侧身过。": "가로로: 한쪽 끝을 서재 벽에(1cm 띄움), 긴 면은 식당과 창 쪽으로, 프렌치 스툴의 X 다리와 팔걸이 스툴의 고리 팔걸이가 식당·창가에서 정면으로 보임; 스툴 전체가 벽 길이 안, 커피 테이블 끝에서 약 30cm라 앉아서 손이 닿음. 대신 벽 쪽 길은 이쪽에서 못 들어가고, 회전의자로 가려면 커피 테이블과 소파 사이(약 39cm)를 옆으로 지나야 함.", "¥23 黑色铁艺小圆几（台面 Φ20、高 58、圆底座 Φ20）塞进书房墙和窗玻璃的墙角，在转椅左后方：离墙约 1.5cm、离玻璃约 3cm，离转椅约 6cm；转椅一转就够得着，完全不占去窗边的路（转椅到沙发之间留出约 72cm）。这里不放花瓶（小孩够得着），兰花放在沙发后面那根柱子上。": "¥23 검은 철제 작은 원형 테이블(상판 Φ20, 높이 58, 원형 받침 Φ20)을 서재 벽과 창 유리 모서리, 회전의자 왼쪽 뒤에: 벽에서 약 1.5cm, 유리에서 약 3cm, 의자에서 약 6cm; 의자를 돌리면 바로 닿고 창가 길을 전혀 막지 않음(의자–소파 사이 약 72cm). 여기엔 꽃병 없음(아이 손이 닿음) — 난초는 소파 뒤 기둥 위에.", "沙发后角落那件上面放一个玻璃小花瓶，插三枝黄色蝴蝶兰（一共十六朵），往客厅这边弯；在沙发背后、高 80，小孩够不着。": "소파 뒤 모서리 소품 위에 작은 유리 꽃병, 노란색 호접란 세 줄기(모두 16송이)가 거실 쪽으로 휘어짐; 소파 뒤 높이 80이라 아이 손이 닿지 않음.", "沙发后面的墙角放黑色碳化木方柱（18.5×18.5、高 80，¥198.8，带一点自然裂纹）：方方正正塞进墙角（离墙 1cm、离玻璃 3cm），比 30 的细很多，离沙发弧背更远；高 80 和沙发靠枕顶差不多齐；黑色和茶几的黑格栅是一套，上面放兰花。": "소파 뒤 모서리에 검은 탄화목 사각 기둥(18.5×18.5, 높이 80, ¥198.8, 자연 균열 약간): 모서리에 반듯하게(벽에서 1cm, 유리에서 3cm), 30짜리보다 훨씬 가늘고 소파 곡면에서 더 멀어짐; 높이 80은 소파 등쿠션 윗면과 거의 같음; 검정은 커피 0; 미끄럼 방지 패드.", "柜侧挂画": "현관장 옆 그림", "两幅小画 30×40": "작은 그림 두 점 30×40", "不挂": "안 걸기", "开门第一眼：玄关柜朝门的那块侧板上挂一幅竖幅大画（45×100，细黑框，画心离地约 0.95–1.95m），绿色、灰蓝的大叶子，和沙发上的花抱枕、窗外的树是一个颜色；人一进门视线先停在画上，不会直接看穿到餐厅。画框要薄（2.5cm 以内），DB 柜门开到底也碰不到。": "현관 문을 열면 정면 왼쪽 현관장 옆판에 세로 그림 45×100; 액자 2.5cm 이하.", "去房间走廊": "침실 복도", "平织长条 80×200": "평직 러너 80×200", "去房间的走廊铺一条平织长条 80×200：从主卧门开门的范围外面开始（主卧门是往走廊开的），一直铺到走廊口，两边各露出约 16cm 地面；颜色跟客厅地毯一样，客厅和走廊连成一套。": "침실 복도 러너 80×200, 거실 러그와 같은 색.", "马蒂斯剪纸风 45×100": "마티스 컷아웃 45×100", "叶子画 45×100": "잎 그림 45×100", "开门第一眼：玄关柜朝门的侧板上挂一幅马蒂斯剪纸风的竖幅画（45×100，细黑框）：钴蓝和叶绿的海藻、叶子剪影铺在米白底上，颜色跟沙发上的蓝绿花抱枕、客厅的绿地毯呼应；形状简单、颜色干净，没有自然光的玄关也一眼就亮。画框薄于 2.5cm，DB 柜门开到底也碰不到。": "마티스 컷아웃 스타일 세로 그림 45×100.", "餐桌往厕所墙挪 45cm：靠玄关柜那边的过道不走人；西头那把椅子坐着时背后到厕所墙约 42cm，侧身坐进去；南边靠走道那把藤编扶手椅背对着餐边格，餐边格下柜改成推拉门（不用往外转，椅子挡不着）；抽屉 30 深、全拉出滑轨，椅子推进桌下能拉出约 25cm，有人坐时先推椅子；靠厨房那头（宝宝椅）到厨房台面约": "식탁 45cm: 사이드보드 아래는 미닫이문, 서랍은 의자를 밀어 넣고 약 25cm; 주방 쪽 끝에서 카운터까지 약", "窗角斜放（南洋）": "창가 코너 비스듬히(난양)", "斜放角度": "각도", "椅子和卡门凳平行于窗：人朝沙发坐，窗光从侧面照在书上；椅背离书房墙约 2cm，脚凳和沙发之间留约 71cm（藤编椅约 60cm），从这里去窗边。": "의자와 카르멘 스툴을 창과 평행하게: 소파를 보고 앉음, 스툴과 소파 사이 약 71cm(라탄 약 60cm).", "椅子和卡门凳平行于窗、朝书房墙坐：电视挂在书房墙正对沙发的中间，从这里看要往餐厅那边斜着转约 55°；椅背离沙发约 6cm，脚凳和书房墙之间留约 67cm（藤编椅约 56cm）去窗边。看电视还是沙发和转椅舒服。": "의자와 카르멘 스툴을 창과 평행하게, 서재 벽을 보고: 스툴과 서재 벽 사이 약 67cm(라탄 약 56cm).", "扶手椅斜放在沙发这头的窗边，离沙发墙约 45cm，往茶几转": "암체어를 소파 쪽 창가에 비스듬히(소파 벽에서 약 45cm), 커피 테이블 쪽으로", "°，离玻璃约": "°, 유리에서 약", "cm，转椅背超出约": "cm 넘고, 회전의자 등받이는 약", "cm；从餐厅进客厅走转椅和书房墙之间，约": "cm; 식당에서 거실로 들어오는 길(회전의자와 서재 벽 사이) 약", "cm。": "cm 이동.", "乐园按店家 3150×1220×750 的比例整体缩放：2.6 套 260×101×62（座高约 34），2.9 套 290×112×69；座高最好跟店家确认。茶几离沙发约 38cm。": "러위안 소파를 매장 3150×1220×750 비율로 축소: 2.6 세트 260×101×62(좌석 약 34), 2.9 세트 290×112×69. 좌석 높이는 매장에 확인.", "白圆柱 Φ30×50": "흰 원기둥 Φ30×50", "黑圆柱 Φ30×50": "검은 원기둥 Φ30×50", "圆柱边几 Φ30×50（白色或黑色，上面不放花，放杯子、手机、一本书），夹在沙发和椅子之间，两边各留约 4cm；椅子为它往书房墙挪了": "원기둥 사이드 테이블 Φ30×50(흰색 또는 검은색, 위에 꽃 없음)을 소파와 의자 사이에; 의자를 서재 벽 쪽으로", "白圆柱 Φ30": "흰 원기둥 Φ30", "床头靠窗那边放白色圆柱边几 Φ30×55，落地放在窗玻璃和床之间：离床架和离玻璃各约 6cm，离床头墙约 10cm；台面比床垫高约 3cm，放手机和一杯水。实心圆柱比铁几有分量、台面大一圈，和客厅的圆柱边几是   LANG = l; try { localStorage.setItem('c2lang', l); } catch (e) {}
  document.documentElement.lang = { en: 'en', ko: 'ko' }[l] || 'zh-CN';
  document.title = l === 'zh' ? TITLE_ZH : (DICT[l][TITLE_ZH] || trTo(TITLE_ZH, l));
  document.getElementById('view').setAttribute('aria-label', l === 'zh' ? VIEW_ZH : (DICT[l][VIEW_ZH] || trTo(VIEW_ZH, l)));
  ['zh', 'en', 'ko'].forEach(k => document.getElementById('lang-' + k).setAttribute('aria-pressed', k === l));
  trTree(sheetEl); trTree(viewBar);
}
['zh', 'en', 'ko'].forEach(k => document.getElementById('lang-' + k).addEventListener('click', () => setLang(k)));
setLang(LANG);
if (WALK_ONLY) { state.sheer = 'open'; walkStart(); walkSetPlaying(false); }   // the walk-only copy: the living room's sheer
walkLangSync();
</script>
